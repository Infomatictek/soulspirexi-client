; game's own); sharp (True Font in /vana) draws each name as VanaCore's own text, as the sharp item count is, in
; nameplates.family, bold with nameplates.bold, at the screen's own pixels (Direct3D 12 draws the names
; over the 3D scene at the size it's shown, as DLSS has them, so a smaller or square
; resolution.background doesn't blur them). The icons before a name and the stars under it stay the
