[ui]
; The game's interface; needs renderer=d3d12 or d3d11.
; Its shape in a window of another shape: game (the game's resolution's), a shape (16:9), or off
; (stretched to fill). Kept centered: full height in a wider window, full width in a taller one
; (16:10). Only draws of the interface's own target of that shape are squeezed: it takes effect with
; [ffxi] resolution.ui=window or window-<percent> (fitted to the shape), or with a resolution.ui of
; the shape (1280x720 for 16:9) in a window of another, and does nothing with a share of the screen
; (auto-75) of the screen's shape. /vana > Client > Game > UI aspect ratio. A window in the windowed
; modes has the shape it was made at ([ffxi] resolution.game), not what Windows leaves of it for a
; title bar that doesn't fit the screen (1920x1080 windowed on a 1920x1080 screen), so that never
; squeezes the interface. Applies while the game runs. Default: game
;aspect=off
; 1 draws a menu resolution smaller than the window at the window's resolution; the game's
; textures are then magnified with its point filter (blocky at 1.5x, 2560x1440 in a 3840x2160
; window). Default: 0 (at its own size, stretched smoothly, as the game does)
;native=1
; (Any renderer.) The key that hides the game's interface and shows it again (its windows, the chat
; log, the bars; the names over heads stay), VanaCore's drawing and addons' with it: a key's name as
; /bind takes it (f11, scrolllock, numpad0, ...), or off. In the world only; Escape or a cutscene
; brings it back too. The game doesn't see the key. Default: f11
;hide.key=off
; 1 lets the mouse turn the camera while the interface is hidden (the game takes the mouse away with
; it); the cursor stays hidden. Default: 1
;hide.camera=0

[graphics.effects]
; Each 0 turns that effect off. Changes apply while the game runs. <key>.enabled=0 turns one off and
; keeps its value (the /vana window's effect toggles write it): ao.enabled=0
;ao=1.0
;radius=2.0
; The occlusion's taps a pixel each frame, gathered over frames: 0 low (6), 1 medium (10), 2 high (16), 3 max (24, /vana's Max),
; 4 above max (32, this setting alone), each worked out at the scene's full size. Default: 3
;ao_quality=3
; Fewer of those taps past each of three rings out from the camera, ao_ring_spacing world units apart: all of them
; inside the first, then 75%, 50% and 30% (never under 4). Far away the taps fall on a small patch of the screen, so the
; shading is the same, a little grainier. 0 takes them all everywhere. Default: 1, 15
;ao_rings=1
;ao_ring_spacing=15
; How much of the occlusion's strength characters take, against the world: 1 the same, 0 none, 2 twice as much.
; (renderer=d3d12) Default: 1.25
;ao_chars=1.25
; How far the occlusion is smoothed across a character's own surface, world units each way: a low-polygon model's facets
; shade each other in flat patches the game's lighting hides. Only over the characters' pixels (their draws mark the stencil),
; so the world keeps its sharp corners; on the surface, not across their edge. 0 is off. (renderer=d3d12) Default: 0.4
;ao_soft_chars=0.4
;fog=0.004
;fog_falloff=0.08
;fog_height=2.0
; How far below the camera the fog goes on thickening, world units; from there on down it's as thick as it gets. 0 keeps
; it even everywhere below the camera. Without a floor, low water, a harbour or a valley seen from above drowned in a fog
; that grew without limit with the drop. Default: 4
;fog_floor=4
;fog_max=0.5
; How much the sun lights the fog when you look toward it, and how tightly the glow gathers
; around the sun (0 spreads it everywhere, 0.95 a small halo).
;fog_sun=0.5
;fog_g=0.6
; The height fog's colour: game (the zone's own, which follows the game's weather and time), sky (the sky in view's colour,
; Direct3D 12 only) or custom (fog_custom, #RRGGBB). Only VanaCore's height fog: the game's own distance fog keeps its colour.
;fog_color=game
;fog_custom=#B8C8DC
;bloom=1.5
;threshold=0.85
;rays=0.6
;rays_decay=0.965
;rays_length=0.85
; The moon: how big it is drawn (a multiple, 1 as the game draws it, 0 hides it) and how bright (a multiple, 0 to 2). It's the
; game's own moon, found by where the game places it (1000 units from the camera, the sun's 900); the bloom's halo and the
; god rays round it are bloom and rays above. Defaults: 1 and 1
;moon_size=1
;moon_brightness=1
; The night: outdoors, through the Vana'diel night (full from 20:00 to 04:00, easing in from 17:00 and out by 07:00), the world's
; light is dimmed, the ambient most (1 - 0.75 x night) and the moon's less (1 - 0.35 x night), so moonlit slopes keep their
; shape; lamps' and torches' own lights, flames, windows, effects and the sky are left as they are. 0 is off. night_moon is the
; moonlight's colour while it's on, 0 to 1: the picture drawn toward a cool blue-grey, lamps and effects keeping their own
; colour (Direct3D 11 and 12). Defaults: 0 (0.5 switched on in /vana: Graphics > Lighting > Dark night, which switches Bright night off)
; and 0
;night=0
;night_moon=0
; A brighter night, for those who find the game's too dark, lit as the day is: outdoors, through the same night (easing in from
; 17:00, full from 20:00 to 04:00, out by 07:00), the moon's light (the game's night light from one direction, as the sun's by
; day) is raised to 1 + 2.5 x night_bright, so what faces the moon is lit and what doesn't stays dark, and the moon's shadows
; come in as the sun's do (at 1 about 60% of the day's sun, at 2 about the sun's). night_bright_ambient (General lighting) raises
; the light everything gets the same, to 1 + 0.75 x it: it flattens the picture, so it's 0 unless set. Lamps, effects and the sky
; are left. 0 to 3 each, night_bright 0 is off (1 switched on in /vana: Graphics > Lighting > Bright night, Moon strength and General
; lighting; the switch takes both, and switches Dark night off). Any renderer. Defaults: 0 and 0
;night_bright=0
;night_bright_ambient=0
; A stronger sun: outdoors, through the sun's hours (full from 07:00 to 17:00, easing in from 06:00 and out by 18:00), the sun's
; light (the game's day light from one direction) is raised to 1 + day_bright, so what faces the sun is lit brighter and the shade
; stays as it is; its shadows show as a stronger sun's do (sun_direct). The light on a surface stops at full, so past that the
; sunlit places are as bright as their textures get: for a blown-out day, lower the bloom's threshold and raise the grade's whites
; with it. Characters are lit by the same sun. Lamps, effects and the sky are left. 0 to 3, 0 is off (1 switched on in /vana:
; Graphics > Lighting > Sun strength). Any renderer. Default: 0
;day_bright=0
; Brighter indoors: in a Mog House and in a zone lit by a fixed light alone (caves, dungeons, rooms: the zone's model DAT says so,
; or its light hasn't moved with the clock 10 seconds after zoning in), the world's ambient light is raised to
; 1 + 0.75 x indoor_bright and the zone's own light to 1 + 0.5 x indoor_bright, easing in over half a second. Lamps, effects and
; what the game draws unlit are left. 0 is off, up to 5 (1 switched on in /vana: Graphics > Lighting > Indoor brightness). Any renderer.
; Default: 0
;indoor_bright=0
; Force ambient light (Windower's game_forceambientlight, Ashita's /ambient): everything the game lights has at least this much
; ambient light, by day and night, indoors and out, so dark places show; each lit draw's ambient is raised until its brightest
; channel reaches it, keeping its tint (0 off, 1 everything lit full and flat; 0.5 switched on in /vana: Graphics > Lighting > Force
; ambient light). After night, night_bright and indoor_bright. Any renderer. Default: 0
;ambient_force=0
; The player's light: a light hung over the player shines down, a soft pool of light round them that goes where they go
; (Direct3D 11 and 12). Through the night (with night on, outdoors) it lights the pool, and with night off does nothing; by day
; (and indoors) the world round the pool goes darker instead. player_light is its strength, 0 off (1 switched on in /vana, up to 2);
; player_light_radius the pool's radius in world units (3 to 20); player_light_warm its colour, 0 white to 1 a torch's orange;
; player_light_day how dark round the pool by day, 0 not to 1 (0.9 of the light off). Defaults: 0, 8, 0.5 and 0.5
;player_light=0
;player_light_radius=8
;player_light_warm=0.5
;player_light_day=0.5
; Warmer by day, cooler at night: the colour grade's warmth (above) moved this much toward warm by day and toward cool at night,
; outdoors, easing through dusk (17:00 to 20:00) and dawn (04:00 to 07:00); 0 to 2, 0 off (1 switched on in /vana: Graphics > Lighting >
; Temperature). With the colour grade (grade above 0)
;day_night_warmth=0
; The game draws its text a glyph at a time, one draw each: a page of battle text (a bard's songs landing on the party) is
; 400-800 draws a frame while the lines show, and the frame rate dips. Small screen-space quads drawn one after another with
; the same state (a line of glyphs, a row of icons) can go to the graphics card as one draw instead (1). Off until it has
; been proven in play. Default: 0
;textbatch=0
; The zone's repeated pieces drawn together (DirectX 12): the game draws its zone a piece at a time, and an open zone at a long
; draw distance is thousands of draws a frame, mostly the same few meshes (the Sanctuary of Zi'Tah at 8x: 6,100 draws, 944 of them
; one cedar), each costing the CPU the same. With this on (1), the zone's draws of one mesh, texture and state go to the graphics
; card as one draw for all their pieces, the opaque ones first and the rest after in their own order. Each piece still casts its
; own shadow. 0 draws each piece on its own, as the game does. Default: 1
;batch=0
;grade=1.0
;sat=1.12
;contrast=0.2
; The grade's tone, -1 to 1 (0 leaves it as it is): brightness (a gamma: black and white stay where they are), and the
; darks and the lights lifted (up) or pulled down (down) by how dark or light each pixel is. Default: 0
;brightness=0
;shadows=0
;highlights=0
; The grade's warmth: cooler (blue, down to -1) to warmer (orange, up to 1), the whole picture. Default: 0
;warmth=0
; The grade's hue (DirectX 11 and 12): every colour turned round the colour wheel this many degrees, -180 to 180 (greys stay as
; they are; 120 takes red to green, -120 red to blue). Default: 0
;hue=0
; More of the grade, between and beyond those (-1 to 1, 0 leaves it as it is): midtones and whites are gains by how light each pixel
; is; light_tint warms (up) or cools (down) the lights only; rolloff (0 to 1) eases lifted lights into white by a shoulder where
; 0 clips them (so Whites and Highlights can go further without flattening them).
;midtones=0
;whites=0
;rolloff=0
;light_tint=0
; Clarity (DirectX 11 and 12): local contrast, each pixel's lead on its surroundings as a gain, strongest in the middle and the lights,
; 0 off, up to 2. Clarity, sharpen and smooth are the colour grade's: off with it (grade=0). Default: 0
;clarity=0
; (DirectX 12: the grade above is laid last, after everything else - every effect, what the game draws into the scene after
; them, and DLSS or FSR - so DLSS 5's look can be pulled back or warmed by it. DirectX 11 grades inside its composite.)
; Reflections on floors and other flat ground (DirectX 12), screen space: what is on screen shows in the ground, fading at the
; screen's edges, with the sun's glint on wet ground. refl is the strength (0 off, 1 as designed, up to 2), refl_wet how wet the
; ground is (0-1), refl_rough how blurred (0-1), refl_dist how far a reflection reaches in world units, refl_quality the steps of
; its search and refl_sun the sun's glint (0 none). refl_quality (0 low, 1 medium, 2 high, 3 max, 4 above max: this setting alone) sets the ray's steps
; (16, 28, 48, 80, 128) and the blur's taps (4, 4, 4, 8, 12). Worked out at the scene's full size and laid over the scene
; by depth. Default: 0 (off)
;refl=0
;refl_wet=0.5
;refl_rough=0.3
;refl_dist=40
;refl_quality=3
;refl_sun=1
; A fake bump map for the reflections: the floor's own picture is read as a height (its grooves and tile edges are low), and
; that tilts the surface the reflection and the glint are taken from, so a reflection on paving ripples at the joints and the
; glint breaks up on the stones, where it was a flat mirror. 0 is the flat mirror, 1 as designed, up to 2. It fades out between
; 25 and 70 world units, where the texture's detail is smaller than a pixel, and takes some reflection out of the cracks.
; Default: 1.3
;refl_bump=1.3
; How far reflections are tilted up where they leave the floor low. Seen from a low camera, a true mirror's reflections skim
; along the ground and find only the dark feet of the walls far away, so the reflection seems to stop part way down the floor;
; tilted up, they show the walls, lamps and characters higher up. 0 is a true mirror, up to 1. Default: 0.15
;refl_lift=0.15
; Grass never reflects and never shows in a reflection: green ground is left out by the floor's own colour (green over red and
; blue), whatever the setting below, and VanaCore's Mass Grass is left out of the reflections altogether. No setting.
; Which ground reflects, by the zone's collision: each of its floors has the kind of ground the game's footsteps sound for, and
; the floors are drawn each frame as a layer that says the kind under each pixel of the scene. 1 keeps reflections and the
; glint to stone and metal (not dirt paths, grass, sand or snow); 2 wood too; 3 anything built (wood and props as well); 0 any
; ground but green (the colour alone). Ground no floor lies on at that depth (a crate's top over the ground, water over its
; bed, ground out of the player's reach) doesn't reflect; a zone whose collision can't be read reflects on any ground. In a zone
; whose land is largely snow (Qufim Island, Beaucedine Glacier, Xarcabard) the stone is rock under the snow and doesn't reflect
; either. Default: 1
;refl_floors=1
; Bounce light (DirectX 12), screen space: light picked up from the lit surfaces near each one, within gi_radius world units; it
; tints what is beside them and fills in corners. gi is its strength (0 off, up to 2); gi_quality its samples a pixel and its
; layer's size, 0 low (6 samples) to 4 max (40), and anywhere between (1 medium: 10, 2 high: 16, 3 ultra: 24; /vana's slider has
; twelve places), or 4 to 14 a frame with temporal on, which blends it with the frame before as the occlusion is (its pattern
; turning each frame), or with DLSS on. Worked out in a layer of about 1000 pixels across at medium and below, finer above (twice
; that at max), the far samples from the occlusion's coarser depth levels. debug=8 (Debug view) shows the layer alone.
; Defaults: 0 (off), 5, 1.09
;gi=0
;gi_radius=5
;gi_quality=1.09
; Glow effects lighting (DirectX 12, experimental), screen space: the fires, glows and spells the game draws light the surfaces near them,
; each in its own colour, by how far it is from the light (the game itself lights nothing with them). elight is how brightly
; (0 off, up to 10; past 1 a surface can take more than three times the light it had), elight_radius how far it reaches in
; world units (up to 50; past 12 and 24 the near light softens a little as it carries further). Only what is on the screen
; gives light. elight_warp is how much of it stays while a home point's teleport plays (from picking the destination until
; the zone changes), whose bright pillars round the character light everything near: 0 none, 1 all. Defaults: 2.5, 30, 0.2
;elight=2.5
;elight_radius=30
;elight_warp=0.2
; elight_lantern is the share of its light a lantern's or torch's flame gives (0 none, 1 as any other fire): the walls round a
; Norg lantern lit far brighter than the flame looks. elight_lantern_tex lists the flame's textures by their hash (the
; drawlog's "hash" of its draws), separated by commas; an empty value lists none. Defaults: 0.5, the Norg lanterns' textures
;elight_lantern=0.5
;elight_lantern_tex=91f16c90d340945e,0aa3fb24d66bfa53,60c9c264c0de9cb1
; elight_dim is the share of its light a zone effect that gives far more than it looks to gives (Al'Taieu's portal
; pools blew a character standing in one out to white); elight_dim_tex lists its textures as elight_lantern_tex does.
; Defaults: 0.2, the portal pools' ring
;elight_dim=0.2
;elight_dim_tex=996d1973ab02ec66
; elight_actor is how brightly an effect on a character lights what is near it (a spell, an ability, a weapon skill: one
; within 3 yalms of a player, NPC or monster, and nearer one than any home point, waypoint or streetlamp), in elight's
; place: elight doesn't change it (0 there still turns all of it off). Protect's shell lit its caster up till they washed out.
;elight_actor=0.4
;sharpen=0.3
;filter=1.0
;aniso=16

; Sun shadows: the scene drawn again from the sun into two shadow maps (a sharp one close up, a
; wider one out to sun_distance), soft at the edges the farther a shadow falls. By day, fading as
; the sun nears the horizon or goes behind cloud. How dark they are, 0-1 (0 is off). Default: 0.6
;sun=0.6
; What casts them: 0 everything (buildings, trees and cliffs too, and what's out of view behind
; you, for 10 seconds); 1 characters only (the zone's own shading is painted into its colours
; already, so its shadows can look doubled on low-detail rock); 2 the environment only
; (characters keep the game's own shadows). Default: 0. On the ferries (Ship bound for Selbina and
; Mhaura, the Open sea routes to Al Zahbi and Mhaura) the whole zone moves past you and only
; characters cast, whatever this says.
;sun_casters=0
; How far out the shadows reach, and how far past your character the sharp close-up map reaches, in
; world units (at least 3). Defaults: 150 and 10; Reach goes up to 300
;sun_distance=150
;sun_near=10
; (renderer=d3d12) A middle map between the sharp one and the far one, out this many world units round
; your character: the far map spreads its 4096 texels over twice sun_distance (some 15 cm a texel at
; 300), the middle one over twice this (some 4 cm at 80), so cliffs and rocks a little way off keep a
; clean shadow edge. Another 128 MB of video memory, and about the far map's cost each frame. 0 is off;
; it's off too when no wider than sun_near or nine tenths of sun_distance or more. Default: 0
;sun_mid=0
; How much of the sharp map's reach it spends fading into the map beyond it (0.05 to 0.9), so thin shadows soften as you
; walk instead of popping in and out as its edge goes by. 0.15 until 2026-11-23. Default: 0.5
;sun_handoff=0.5
; The close-up map's size: 512, 1024, 2048, 4096 or 8192 texels across (8192 is twice as sharp as 4096,
; and takes 256 MB of video memory). The smaller sun_near, the sharper too: the map spreads over that
; many units. Default: 4096
;sun_detail=4096
; (renderer=d3d12) The far map's still shadows - buildings, trees, the zone itself - are drawn again only every this many
; frames plus one, and sooner when the camera moves or turns enough or the sun turns; what walks (characters, effects) is
; drawn every frame over them. A tree's sway or a far door's shadow moves in small steps out there. Saves most of the shadows'
; cost each frame, for 64 MB of video memory. 0 draws the far map whole every frame, as before. 0-15. Default: 3
;sun_far_hold=3
; (renderer=d3d12) The close-up map's still shadows are drawn once into a layer a little wider than the map needs, and kept
; while the camera stays inside it and the sun doesn't turn - for at most this many frames; what walks (characters, effects)
; is drawn every frame over them. A tree's sway or a door's shadow near you moves in steps. Saves most of the close-up map's
; cost (a jungle drew some 5000 casters into it every frame), for another map's video memory (64 MB at 4096, 256 MB at 8192).
; 0 draws the close-up map whole every frame, as before. 0-600. Default: 30
;sun_near_hold=30
; (renderer=d3d12) A still layer (the far map's and the close-up map's, above) is drawn again over 4 frames, a quarter of its
; casters each, the old one serving the shadows meanwhile, instead of all in one frame: no hitch every few frames in a zone of
; many trees and rocks (Beaucedine's pines took some 12 ms of the GPU a redraw). The new layer's shadows land up to 4 frames
; later. Takes a second map of each layer's size (64 MB at 4096). 0 draws a layer whole in one frame. Off by default since a
; player's shadows strobed with it every 4 frames, on their card and not on others (2026-11-05). Default: 0
;sun_roll=0
; (renderer=d3d12) 0 leaves the zone's plants - trees, bushes, VanaCore's grass: what's see-through and placed in the zone, or
; swayed by the game - out of the sun's shadows: they cast none, and the ground under a canopy is lit. Buildings, cliffs and
; characters still cast. Saves most in a jungle (Kazham, the Woods). Default: 1
;sun_plants=1
; (renderer=d3d12) 1: a plant's shadow keeps the pose the plant was first seen in, for as long as you stay in the zone, so trees
; the game sways (Kazham's palms) don't make the ground under them flicker. 0: the shadow sways with the plant. Default: 1
;sun_plants_still=1
; Seconds a shadow of the zone's (a building, a tree, a cliff) takes to fade away when it goes. What has once been seen
; casting is kept casting for as long as you stay in the zone, so that's only something a thousand yalms off, unseen for a
; minute. What moves (a boat's coast) and characters still go at once. 0 lets them go at once. 0-120. Default: 1
;sun_fade=1
; The shadow maps' taps a pixel, 16, fewer past each of three rings out from the camera, sun_ring_spacing world units
; apart: 12, then 8, then 6. Far away a pixel's filter covers a small patch of the screen, so the shadows are the same, a
; little grainier at their soft edges. 0 takes all 16 everywhere. Default: 1, 15
;sun_rings=1
;sun_ring_spacing=15
; Normal maps' switch (renderer=d3d12; the same as /vana's Graphics tab): 1 lets a texture pack's maps bend the
; lighting (see [graphics] normalmap), 0 leaves them out. Default: 0
;normalmap=1
; How fast the edges soften with distance from the caster; 0 keeps them as hard as the map draws
; them (still softening like real sunlight over long distances). Default: 0
;sun_soft=0
; Above 0: the shadows on characters (not theirs on the ground) blurred this far across them instead, in world units, whatever
; sun_soft is - narrower than sun_soft_zone, which let a rocky monster's own shading flicker from frame to frame. 0: characters
; take sun_soft_zone as the rest do. (renderer=d3d12) Default: 0
;sun_soft_chars=0
; The shadows on the zone (rock, ground, buildings) and on characters blurred this far across their surfaces, in world units.
; Low-polygon shapes give hard polygon-shaped edges and hatching in their shadows; this rounds them off, and softens cast
; shadows' edges a little with them. 0 leaves them as sharp as the map draws them. /vana > Graphics > Shadows > Advanced Settings > Edge smoothing.
; Default: 0.5
;sun_soft_zone=0.5
; Casters nearer the surface than this don't shade it (the neighbouring faces of the same rock).
; Default: 0
;sun_min=0
; How much surfaces turned away from the sun are darkened, 0-1. Default: 1
;sun_face=1
; How much of the light has to be the sun's before shadows show (less under cloud and at night):
; 0 ignores it. Default: 0.5
;sun_direct=0.5
; Long shadows at dusk and dawn: 1 keeps them (long, from low over the horizon) while the game's light
; sets past it, and brings them in over Vana'diel 05:30 to 06:30 (the game's own light is off until
; 06:00 and then comes on at once), and takes them out and in again over 17:30 to 18:30 (the game's
; light turns from the sun to the moon at 18:00), 0 fades them out as the sun nears the horizon. Default: 1
;sun_dusk=1
; Shadows at night, from the moon (any renderer). 1: all through the night with no fading: the moon's till 06:00, the sun's from
; then, the fade under cloud (sun_direct) taken by day only (07:00 to 17:00, eased over the half hour either side), and only a dip
; of 2 Vana'diel minutes either side of 06:00 and 18:00, where the game's light turns round, so they don't swing across the ground
; in one frame. 0 takes them out outdoors from 18:00 until 05:30, when the sun's come back in with the dawn (06:00 with sun_dusk 0),
; with the dawn's and dusk's fades as before. Rooms, zones lit by a fixed light and a sun placed by hand (sun_free) are left as
; they are. Default: 1
;sun_moon=1
; The night's own strength and casters, in sun and sun_casters' place from 18:00 to 06:00 outdoors while sun_moon is on (the
; hand-over falls in the dip at 06:00 and 18:00). The same numbers as theirs: 0-1, and 0 everything, 1 characters only, 2 the
; environment only (characters keep the game's own shadows then, with the game's Config > Shadows on). sun at 0 (or the
; Shadows switch off) is no shadows at night either. Defaults: 0.6 and 0, as by day
;sun_moon_strength=0.6
;sun_moon_casters=0
; Puts the shadows' light where sun_free_az and sun_free_el say, whatever the game's sun, the hour, the cloud (sun_direct) or a
; room (moghouse) do: no dusk clamp, no dawn ramp, full strength, so shadows show at night too. For testing shadows at a given
; angle (the game's own lighting stays as it is). Default: 0
;sun_free=0
; The placed sun's bearing round the horizon, in degrees (0-360), and its height over it (-20 to 90; 90 is straight down).
; Default: 170 and 41
;sun_free_az=170
;sun_free_el=41
; The game's sun and moon turned this many degrees toward the south (-45 to 45): the game runs them exactly east-overhead-west,
; which leaves walls facing north or south edge-on to the light and flickering in the shadows. 0: as the game has them. Not a
; sun placed by hand. Default: 15
;sun_tilt=15
; 1: the shadows weighed against the game's own smooth shading (it takes a shadow off a surface the game turns from its sun,
; and lets a low-polygon rock's lit side fade round past its edges instead of ending in a hard line along them), which loses
; shadows where the game's light and the shadows' part (a placed sun, the tilt, dusk). 0: the shadow maps alone decide.
; Default: 0
;sun_game_shading=0
; 1: the zone's own rock and ground, where they are curved, take the sun's shadow as the smooth surface their shading describes,
; not polygon by polygon: a low-polygon dome or hillside turning from the sun fades into its shadow along a curve, where each
; polygon turned from the light went dark whole - a staircase along the shadow's edge under a low sun, a wall of dark squares
; under a high one. Buildings are left as they were. It reads the zone's own meshes (sun_zone_mesh) and draws their curved
; triangles once more a frame. 0: by the polygons. Default: 1
;sun_curved=1
; The zone's shadows drawn from every piece within their reach of you, every frame, whatever the camera sees (1): the game's
; own renderer draws them for the shadow maps alone, at their highest detail, a tall wall from as far off as its shadow
; reaches; while it does, the game's own draws of the zone and the shadow cache are left out of the maps, so the zone's
; shadows don't change with the camera (characters still cast). 0: only what the game drew for the camera this frame, and
; what the shadow cache kept from earlier. Default: 1
;sun_seek=1
; The zone's shadows from its own meshes, read from its DAT at zone-in and kept on the graphics card while you're there (1), in
; place of sun_seek's pass, so nothing the game draws or frees makes them come and go. Characters still cast from the game's
; draws. 0: sun_seek's pass, as before (Direct3D 12). Default: 1
;sun_zone_mesh=1
; The sun's parts one at a time, to turn off while a flicker is hunted (1 on, 0 off; Direct3D 12). sun_cache: what has once
; cast a shadow goes on casting it after the camera looks away (0: nothing kept but the plants' still poses, only what the
; game draws this frame casts; sun_seek runs all the same). sun_late: what the game draws late in a frame, after the effects,
; casts from the next frame on. sun_sharp: the sharp close-up map round you (0: the wide map alone). sun_cull: a caster
; standing well past a map's sides is left out of it (judged by one corner: a long wall reaching in can go with it).
; Defaults: 1, but sun_late and sun_cull 0. Only sun_sharp has a /vana row (Graphics > Shadows > Advanced Settings > Sharp shadows near you)
;sun_cache=1
;sun_late=0
;sun_sharp=1
;sun_cull=0
; How much of the sun's shadows stay indoors, 0-1: in your Mog House, and in zones lit by a light that never moves (no sky:
; Ru'Hmet, Garlaige Citadel, Ordelle's Caves, the Necropolis), where the light falls as if through a ceiling over everything
; and its shadows black the zone out. A zone counts as one of those until its sun is seen moving with the clock, about half a
; second after you arrive; the shadows then fade in. Default: 0 (none)
;moghouse=0
; Lighting per pixel rather than per vertex: 0 off (the game's own), 1 the sun and moon (torches
; stay the game's), 2 every light. Default: 1
;light=1
; Occlusion, shadows and bounce light smoothed over frames (steadier as the camera moves), 0-0.99 (0.99 holds
; about a hundred frames: the steadiest, and slowest to catch up when something new comes into view). Default: 0.99
;temporal=0.99

; The cel-shaded look: off unless you turn it on. Ink lines around objects (0-1 how dark;
; outline=1 is black), and where surfaces fold sharply.
;outline=1
; The lines' width in pixels at 1080p (wider screens get proportionally wider lines). Default: 1
;outline_width=1.5
; The same for characters (players, NPCs, monsters): thin lines suit them where the world wants thicker ones, so
; outline_width is the world's and this is theirs. 0 is the same as outline_width. Direct3D 12 only. Default: 0
;outline_width_chars=1
; How big a jump in depth makes a line around an object: smaller finds more edges. Default: 0.1
;outline_depth=0.1
; How sharp a fold makes a line (0.25 is about 40 degrees; 0 turns fold lines off). Default: 0.25
;outline_crease=0.25
; Lines fade out by this distance, so far scenery doesn't turn to scribble. Default: 60
;outline_fade=60
; 1 keeps VanaCore's grass apart from the lines: only its own on it (outline_grass, none by default), and those round
; what's near it found as if it weren't there (DirectX 11 and 12). 0 outlines it like the scenery. Default: 1
;outline_nograss=1
; With outline_nograss=1, the grass's own lines: how dark, as a share of outline (0-1; 0 none). Default: 0
;outline_grass=0.4
; Their width, as outline_width (0 is outline_width). Default: 0
;outline_width_grass=1
; How big a jump in depth makes a line on the grass, as outline_depth (larger keeps only the tufts' outer edges; 0 is
; outline_depth). Default: 0
;outline_depth_grass=0.2
; The distance the grass's lines are gone by, as outline_fade (0 is outline_fade). Default: 0
;outline_fade_grass=30
; Brightness in this many flat steps, colours kept (2 or more; 0 is off). 3-5 looks cartoon-like.
;bands=4
; How soft the step edges are, 0 (hard) to 1. Default: 0.15
;band_soft=0.15
; Flattens texture detail into even patches while keeping edges sharp, 0-1. Default: 0
;smooth=0.7

; Depth of field: your character sharp, the scenery behind blurred with distance. The widest blur,
; in pixels at 1080p (8-16 gentle, 30 strong); 0 is off. Default: 0
;dof=12
; How deep the sharp zone is past the focus, as a share of its distance (0.5: sharp to half as far
; again). Default: 0.5
;dof_range=0.5
; Past the sharp zone, how far until the blur is full, in multiples of the focus distance. Default: 3
;dof_far=3
; Blur for things between the camera and your character, 0-1. Default: 0
;dof_near=0
; A fixed focus distance in world units; 0 follows your character. Default: 0
;dof_focus=0
; With dof_focus 0: 1 focuses on your character wherever it is on the screen (the free camera's
; Focus: Player); 0 on the nearest thing just below the screen's middle, where the game's own camera
; keeps the character. Default: 0
;dof_player=0
; 1 leaves the sky sharp: its clouds, the sun and the moon. Default: 0
;dof_sky=1

; DLSS 5 ([graphics] dlss5=1). Its look: 0 default, 1 natural, 2 cinematic. Default: 1
;dlss5_style=1
; The size it runs at, a share of the scene's each way: 0.75 costs about half as much, 0.5 about a quarter, 0.3
; about a tenth (0.25 at least). What it
; changes is laid back onto the scene at its own size, so its light and colour reach the whole picture and its fine
; detail comes out softer. Changing it makes DLSS 5 again (a few seconds). Default: 1
;dlss5_scale=0.75
; Its strength: 1 as it comes (the /vana window goes to 5). Default: 1
;dlss5_intensity=1
; Its local tone and structure strengths, 1 as they come (the /vana window goes to 4). Default: 1
;dlss5_tone=1
;dlss5_structure=1
; The skin's structure strength; -1 leaves it to DLSS 5. Default: -1
;dlss5_skin=-1
; 1 lets it find its own mask. Default: 1
;dlss5_mask=0
; The game's effects (spells, weapon skills, flames, glows: what it draws into the scene after its world) and DLSS 5.
; dlss5_fx_out=1 keeps them out of it: DLSS 5 is handed the scene as it was before them, and they're laid back over its
; picture as the game drew them, before DLSS. dlss5_fx_light=1 lays a glow from the ones that add light (fire, glows, most
; spells: their bright parts, blurred) over what DLSS 5 sees, dlss5_fx_gain times as bright as drawn, past white, so it
; has light sources to light the scene from (not over the sky: the sun, moon and stars aren't lifted). The sprites
; themselves aren't lifted (shown a spell's whole quad lifted, DLSS 5 restyled it as a dark panel with a glowing emblem).
; With both, it lights from the glow and the effects are laid back as drawn. dlss5_fx_actor is the share of that strength
; the effects on characters (spells, abilities, weapon skills: elight_actor's) get: their sprites are big and bright, and
; at the flames' strength washed the ground out to white (0 leaves them out). dlss5_fx_cap is the brightest the glow lifts
; a pixel to, times white: a flame's glow stays well under it, and a beam of light that fills the screen (Tu'Lia's) can't
; be handed at six times white, which DLSS 5 painted as coloured blocks, and Hu'Xzoi's glowing door at twice white, which
; it blew out (0: no ceiling). dlss5_fx_norm is the glow's exposure: the share of the picture the lights may fill (their
; blurred mean) before the strength eases down in step, so a beam that fills the hall gives about the light a crystal
; does instead of lighting every wall at full strength, and a crystal keeps its strength (0: none). Change while the
; game runs. Defaults: 0, 1, 5, 0.25, 1.25, 0.02
;dlss5_fx_out=1
;dlss5_fx_light=0
;dlss5_fx_gain=5
;dlss5_fx_actor=0.25
;dlss5_fx_cap=1.25
;dlss5_fx_norm=0.02
; dlss5_brighten is the most DLSS 5 may brighten a pixel, times what it was handed (0: no limit). At 1 it restyles the
; picture and lights it only where the glow above gives it light, never on its own: left to itself it turned Tu'Lia's
; bright halls white. Changes while the game runs. Default: 1
;dlss5_brighten=1
; dlss5_skip_tex lists the textures (the drawlog's "hash") of effects dlss5_fx_light leaves out. Default: Al'Taieu's portal
; pools (their ring and two glow sprites), which DLSS 5 turned into a field of coloured blocks.
;dlss5_skip_tex=996d1973ab02ec66,f7a8bca5097ad216,8d99561f9547bd07
; 1 lays the light from the effects (elight) onto DLSS's output after DLSS 5, so DLSS 5 doesn't restyle it, in place of
; lighting the scene it's handed. Changes while the game runs. Default: 1
;dlss5_elight_post=0
; With DLSS or FSR on (DirectX 12): 1 tells them how the game's effects and placed objects move too, not only the camera.
; They're drawn a second time into a target of their own with where each was the frame before (found among that frame's
; draws). Costs a little GPU time (/vana stats counts them: "Moving things drawn again"). The match is a guess, and where it's wrong
; an effect tears or doubles, worst with frame generation (a maw's vortex, a portal flickering): it broke more than it
; mended, so it isn't in /vana. It was dlss_motion (/vana's Motion for characters and effects), renamed so a 1 saved
; under that name is dropped. 0 (the default) hands them the camera's motion alone, which is exact for the scenery, and
; dlss_reactive and dlss_reactive_moving below say where it isn't a thing's own. With frame generation an effect's model
; takes the camera's motion at its own depth (fg_fx_motion). Changes while the game runs. Default: 0
;dlss_motion_all=1
; With DLSS or FSR on (DirectX 12): 1 tells them how the characters move (players, NPCs, monsters), each part found as
; the frame before's nearest of its kind, and leaves them out of dlss_reactive_moving's mask where it's found. Given the
; camera's motion alone, a running character blurred, and the mask made it flicker instead. 0 gives them the camera's.
; Changes while the game runs. Default: 1
;dlss_motion_chars=0
; With DLSS or FSR on (DirectX 12): 1 draws the characters' second pass for their motion (and the moving things' mask) all
; together once the scene is drawn, which costs the CPU about half what drawing each just after itself did in a crowd. 0
; draws each just after itself. Changes while the game runs. Default: 1
;dlss_motion_batch=0
; With frame generation and dlss_motion_all: the least alpha (or light added) at which an effect's model (more than one
; sprite) moves as itself in the made frames, not with the wall behind it. A home point's crystal is faint layers,
; which came out twice a step apart. Lone sprites (motes, sparks) always keep the scene's motion; 0 gives every
; effect the scene's. Changes while the game runs. Default: 0.03
;fg_fx_motion=0
; With dlss_motion_all: 1 gives the zone's plants (trees, grass, VanaCore's grass) their own motion too, as they sway. 0 leaves
; them the scene's: frame generation tore them when given their own, and its optical flow follows the sway itself. Changes
; while the game runs. Default: 0
;dlss_motion_plants=1
; With DLSS or FSR on (DirectX 12): how far they lean on this frame's pixels instead of what they gathered over earlier
; frames, 0 to 1 (/vana > Graphics > DLSS or FSR > Stability). dlss_reactive is for the game's effects (spells, glows, a
; maw's vortex, weather: everything blended over the scene, which can't tell DLSS or FSR how it moves and whose look
; changes without moving), dlss_reactive_moving for what writes depth and moves on its own (characters, monsters, pets,
; trees and grass as they sway, VanaCore's grass, a boat). They're what other games hand their upscaler as a reactive mask;
; FSR also gets the effects as its transparency and composition mask, DLSS the same mask as its bias-current-colour mask.
; Higher is cleaner (no ghosting, smearing, doubling or freezing there) and a little softer than the scenery, which keeps its
; history whole. 0 turns that mask off, as before there was one. Changes while the game runs. Default: 0.8 and 0.5
;dlss_reactive=0.8
;dlss_reactive_moving=0.5

; For tuning: shows one effect on its own instead of the game's picture, so you can see exactly
; what it adds. 1 ambient occlusion (black and white: darker is more shadow), 2 fog (white is
; thicker), 3 bloom, 4 god rays, 5 the sun's shadows (black is shaded), 6 the ink lines (needs
; outline on), 7 depth of field's blur (black sharp, white fully blurred; needs dof on), 9 glow
; effects lighting (what counts as a light, and the light it adds; DirectX 12, elight on). 0 is the
; normal picture. 11 colours the water found over the picture ([graphics] water.detect): magenta the
; game's water models that become VanaCore's water, orange the ones left as the game draws them
; (waterfalls, rivers running downhill, ripples), green tiles found by their shape alone; meanwhile the
; water is drawn as the game draws it.
; 12 the reflections' layer as it is laid over the picture, 13 its weight, 14 what the floor test made of each pixel
; (red how flat, green how squarely it faces the camera, blue the floors' mask; refl on)
; 17 the reflections over the picture in grey, in their own colour at twice their weight (refl on); 18 the ground the
; zone's collision has under each pixel, by kind, over the picture in grey: solid for the kinds the reflections keep to
; (refl_floors), striped for the rest, grey where no floor lies (refl on, refl_floors 1 or more; /vana debug has the colours)
; 15 the shadows' rings and 16 the occlusion's (sun_rings, ao_rings): the picture tinted by the ring each pixel is in,
; green all the taps, then yellow, orange and red past the third, a dark line at each edge (/vana debug's Show rings)
; 19 the pixels ao_chars takes for a character's, over the picture in grey, red: exactly, from the stencil their draws
; mark; where the depth has no stencil (or the game uses it) from their depth drawn again: red where all four of the
; texels round the pixel match, yellow where one to three do (an edge: the pixels that can change hands between frames)
; (DirectX 12)
; 26 VanaCore's grass (Mass Grass) red, shaded by its brightness, and the rest of the picture grey (grass on)
; Picked in /vana debug (Debug views). Never saved here by the game, and not read from here: every game starts at 0.
; Default: 0
;debug=0

[server]
; Used unless the command line passes its own (--server).
; Default: play.soulspirexi.com
;server=127.0.0.1

; The version VanaCore's login reports to the server, which only checks it (major.minor): for a
; server that wants another than VanaCore's own. Default: 2.1.2 (xiloader's; a LandSandBoat server
; wants 2.1.x from 2026-02-12, 2.0.x before)
;loginversion=2.0.1

[input]
; 1 = on, 0 = off.

; The game can't find controllers (fixes the stutter of its repeated controller search). No
; controller works while this is on. Default: 0
;gamepad.disableenumeration=1

; No controller works, and the game doesn't look for them (/vana > Client > Gamepads > Gamepad:
; Disable sets it while the game runs). Default: 0
;gamepad.disable=1

; Switch Game: the gamepad button, or two together, that brings your other game on this PC in
; front (/vana > Client > Gamepads > Switch Game sets it). x<n>: an XInput control (16, 17 the
; triggers), d<n>: a DirectInput button (48 + its number), d32u/r/d/l: the D-pad. Default: none
;gamepad.switch=x16+x0

; Seconds the game's repeated controller search gets the last search's result instead of searching again (each real
; search stalls the game). A device plugged in or removed ends it early. 0 = every search runs. Default: 300
;gamepad.searchinterval=300

; With a fish on the line, the D-pad's left and right fight it as the stick does. 0 leaves the fight to the stick.
; Default: 1
;fishing.dpad=0

; The Windows keys work normally instead of being swallowed by the game (0 lets the game swallow them; it does only in
; its full screen, so in a window they work either way). Default: 1
; A key you've bound with the Windows key (/bind @f1 ...) runs its command either way, while the game is in front, and
; isn't passed to Windows; Windows keys with nothing bound (the Start menu, Win+D) are as this setting says.
;keyboard.windowskeyenabled=0

; Which thread the game's low-level keyboard hook runs on. 1: a thread of its own, so typing in other programs doesn't wait
; on the game's frames. 0: the game's thread, as the game sets it, which is the default under Wine and Proton. Needs a
; restart of the game. Default: 1, 0 under Wine / Proton
;keyboard.hookthread=0

; The game can't move the mouse cursor (menus jumping it around). Default: 1
;mouse.unhook=0

; Key binds (/bind <key> <command>, //bind) wait while the chat line is open: its keys type. Ashita and Windower addons and plugins get
; no key presses then either (XIUI's hotbar keys). /vana > Game Options > Chat > Ignore key binds while typing. Default: 1
;keyboard.blockbindsduringinput=0

; /bind and /unbind don't say what they did in the chat log (boot.txt's "Bound ^F1 to ..." lines).
; /vana > Client > VanaCore > Hide key bind lines. Changes while the game runs. Default: 0
;keyboard.silentbinds=1

; /alias doesn't say what it did in the chat log (/alias list still lists), as Ashita's aliases.silent. Default: 1
;aliases.silent=0

[camera]
; The zoom (the mouse wheel, the game's zoom keys). distance (or 1: /vana, World, Use true zoom): it moves
; the camera nearer and farther, keeping the field of view; both zoom keys at once put it back at the game's 6.
; game (0): the game's own, which narrows and widens the field of view and leaves the camera where it is.
; xicamera isn't loaded while it's distance (it sets the same things, and its turning and lock-on settings are
; below); it loads again when it's game. Changes while the game runs. Default: game
;zoom=distance
; How far the camera is from your character with zoom=distance when the game starts, in units (the game's is
; 6; /vana, Options, Camera: Starting zoom). Changed while the game runs, the zoom goes there. Default: 6
;distance=6
; 1: with zoom=distance, the zoom is kept: 2 seconds after it last changed it's written to distance above, so the next game
; starts where this one left it (/vana, Options, Camera: Remember zoom). 0: each game starts at distance. Default: 0
;distance.remember=1
; How fast the zoom goes (the wheel and the zoom keys), times the game's, 0.1 to 10, with either zoom: zoom=game changes the
; field of view that much faster, zoom=distance moves the camera that much farther a notch (/vana, Options, Camera: Zoom
; speed). Changes while the game runs. Default: 1
;zoom.speed=2
; How near and how far the zoom goes (0.5 to 50, and up to 500). Default: 1.5, 30
;distance.min=1.5
;distance.max=30
; The field of view with zoom=distance, in degrees up and down, 5 to 170 (the game's zoom went from 24 to
; 77, 57.5 its default; /vana, World, Field of view: the slider goes 20 to 100, a value typed into its box
; further). game leaves it where the game's zoom last put it. Default: 57.5
;fov=60
; With zoom=distance: how fast the camera turns, and up and down, times the game's (0.01 to 20). Default: 1
;turn=1.5
;turn.vertical=1.5
; With zoom=distance: the locked-on camera's distance, times the zoom's (0.1 to 10), and how far round the
; target can get before it turns to keep it in view (0 to 100; the game's is 4). Default: 1, 4
;battle.distance=1.2
;battle.range=8
; 1 hides the mouse cursor while the right button is held to turn the camera (the game shows an arrow
; for the way it turns); it comes back when the button is let go. Changes while the game runs. Default: 0
;mouse.hidecursor=1
; 0: the mouse cursor at the window's edge leaves the camera alone (the game turns it while the cursor touches the left or right
; edge, and up and down at the top and bottom). 1 is the game's (/vana, Options, Camera: Turn at screen edge). Changes while the
; game runs. Default: 1
;mouse.edgeturn=0
; 1 lets the Home key turn the camera round behind your character, as the game has it; 0 Home leaves the camera
; alone. Changes while the game runs. Default: 0
;home.reset=1
; 1: the controller's Change View button (Toggle First-Person in the launcher's gamepad setup; the right stick pressed in
; a normal install) turns the camera round behind your character, as Home does, instead of switching to first person
; (/vana, Options, Camera). In first person it still switches back. The keyboard's first-person key stays as it is.
; Changes while the game runs. Default: 0
;view.reset=1
; 1: free look (/vana, Options, Camera: Free look; /freelook flips it). Turning the camera no longer turns your character
; as it walks: you keep walking the way the camera faced when free look came on (and after each zone), wherever you look.
; Not in first person. Swing behind (behind=1) waits while it's on. Changes while the game runs. Default: 0
;freelook=1
; 1: the /freecam camera (detached from your character, flown with W A S D and the mouse) is floaty: it glides to a stop and
; turns with some lag (the Floaty switch and the Lag slider in the /freecam window; /freecam float flips it). freecam.lag is the seconds it takes
; to get most of the way to where the keys and mouse ask (0.05 to 3). Change while the game runs. Default: 0, 0.35
;freecam.float=1
;freecam.lag=0.5
; 1 keeps the camera out of walls, floors and ceilings: one between your character and the camera pulls it in, just in front
; of it, and it eases back out as the way clears, so a far zoom in a small room or corridor doesn't look in from outside
; (/vana, Options, Camera: Keep the camera out of walls). Not an event's camera, nor first person. Works with either zoom,
; and changes while the game runs. 0 is the game's. Default: 1
;walls=0
; 1 locks the camera to your character: it goes with you at once as you move (/vana, Options, Camera). The game's
; camera eases toward you and stays put until you're 6 from it, so it lags and swings round as you set off and stop.
; It goes up and down with you too, so slopes and stairs don't tilt it. Pushed in by a wall, the locked camera eases
; back out to the zoom's distance (6 with the game's zoom). Changes while the game runs. Default: 0
;lock=1
; 1: as your character moves, the camera swings round behind it (/vana, Options, Camera: Swing behind when moving). It follows
; the way you go, not toward the camera (walking backward or down the screen leaves it), and slower at a walk; locked on, the
; game's camera keeps the target in view instead. It goes with your character at once, as lock=1 does. behind.speed: how fast it
; swings, times its own (0.1 to 10); behind.delay: seconds after you set off, or turn the camera yourself (the mouse, the
; stick, the keys), before it swings (0 to 10). Change while the game runs. Defaults: 0, 1, 1.5
;behind=1
;behind.speed=1.5
;behind.delay=1
; Where your character sits on screen, as in Guild Wars 2's camera position: percent of the screen right of the middle
; (negative: left) and above it (negative: below), -45 to 45 (/vana, Options, Camera: Horizontal and Vertical position).
; The camera moves to its side and up or down (by a share of its distance, so your character stays put on screen at
; any zoom) and still turns round your character. The game keeps the camera out of walls and the ground where it's
; moved to, so it goes as far down or aside as what you see has room for. It eases out while an event has the camera
; and in first person. Works
; with either zoom, and changes while the game runs. Default: 0, 0
;offset.x=10
;offset.y=-8

[freecam]
; The free camera's window and keyframe sequencer (opened by /freecam; the freecam addon, always loaded). While the free camera is
; on and the chat line is closed, these two keys are binds: one records a keyframe at the camera's pose (/freecam key), the other
; plays the sequence or stops it (/freecam play). A key name as /bind takes it (r, f9, numpad1, ...), or off for none; a key you've already
; bound yourself is left alone. They're bound when the free camera comes on and unbound when it goes off. Default: r, p
;key.add=r
;key.play=p
; The window's size, in percent, on top of /vana's own ([vana] scale: this window is drawn in its look, so it grows with it), for a
; screen it's too small or large on. Default: 100
;scale=125
; The window's size as dragged at its resize corner (bottom right), at 100%: width 460 or more; height no less than what the
; tab shown holds (taller, the Sequencer tab's timeline takes the room). Kept as the corner is let go. Default: 640, 0 (as tall
; as the tab holds)
;width=900
;height=420

[screenshots]
; Print Screen (and /screenshot) saves screenshots\<date>\<character>_<date>_<time>.png. /screenshot open opens the folder.
; 1 keeps VanaCore's own drawing (label, FPS counter, addons' text) in them. Default: 0
;overlays=1
; 1 also puts each screenshot on the clipboard (paste it into Discord or an image editor); the chat log says so
; as it saves. 0 leaves the clipboard alone. Default: 1
;clipboard=0

[commands]
; VanaCore's own commands, each switched off with <name>=0 (/vana > Client > Commands lists them all): VanaCore then leaves
; /name and //name to your own addons and plugins, and the game. /addon, /plugin, /exec, /vana, /wait, /bind, /unbind,
; /unbindall and /alias stay on whatever is here. Default: 1 for each
;copy=0
;cancel=0
;hud=0

[addons]
; 1 holds what scripts\boot.txt loads, except its plugins, back until a character has logged in, instead of running it as the
; game starts: no addon loads at the title screen or the character select, and what loads sees a player in the world.
; Plugins (its /plugin lines) always load as the game starts, as on Ashita: some patch the client before it reads the
; character's inventory at login (cexidats, cexislots). The rest runs once per game start, at the first login; logging out
; and in again doesn't run it again. What loads late doesn't see the packets of that login, except that each Ashita addon
; gets its zone-in (0x00A) as it loads, as on Ashita (logincmd runs the character's profile from it); an addon that needs
; the others has to read the game's state itself. 0 runs all of boot.txt as the game starts. /exec boot runs it by hand.
; Applies at the next start. Default: 1
;delay.login=0
; These load at start without a scripts\boot.txt line: vana (the /vana window) and vanastore (VanaStore, the addon store,
; which the launcher's VanaCore build has from CatsAndBoats/cexi-addons; skipped when it isn't there), and keybinds (the
; key binds window), which is always on. 0 keeps vana or vanastore from loading. Switching one off in /vana > Addons or
; with /addon unload sets 0 (and takes out a boot.txt line loading it); switching it on sets 1. /addon load vana brings
; the window back. freecam and loadscreen load from boot.txt like any addon. Default: 1
;vana=0
;vanastore=0
; The Ashita interface Ashita addons see: 4.16 (CatsEyeXI's Ashita) or 4.30. Addons check it to pick their code; 4.30
; gives them ashita.interface_version 4.3, ashita.addons_version 4.1, ImGui text as it's given and 4.30's additions to
; the API. Plugins keep their own. Applies to each addon as it loads (/addon reload <name>). Default: 4.16
ashita.interface=4.30
; The Ashita addon libraries Ashita addons load (require 'chat', 'imgui', ...), whatever ashita.interface says: 4.30,
; Ashita 4.30's, which have everything 4.16's had and 4.30's additions (chat.color, ...), with the ImGui names 4.16 had
; and 4.30 renamed or dropped defined over them for addons written for 4.16; or 4.16, CatsEyeXI's Ashita's own, for an
; addon the merged set doesn't suit. Applies to each addon as it loads (/addon reload <name>). Default: 4.30
;ashita.libs=4.16
; 1: no chat line as an addon loads or unloads (errors still show), as Ashita's addons.silent. /vana > Client >
; VanaCore > Hide addon load lines. Changes while the game runs; /addon silent [0|1] switches it until the next change
; here. Default: 0
;silent=1
; 1: no chat line as a plugin loads or unloads (errors still show), as Ashita's plugins.silent. /vana > Client >
; VanaCore > Hide plugin load lines. Changes while the game runs. Default: 0
;plugins.silent=1

[characters]
; The Main of the games running on this PC (/vana > Client > Characters): the character whose settings,
; addons and windows its three copies send to the other games, the Alts. Set there; read from this file itself,
; so every game sees it. Default: none
;main=
; Copy Graphics Settings: every setting of the Graphics and Experimental pages, and Client > Game's renderer,
; background resolution, frame rate, V-Sync, anti-aliasing and aspect ratio (not the window's mode, resolution
; or place). Copy Game Options: every setting of the Game Options and HUD pages. A key the Main hasn't (its
; default) is taken out of the Alt. Copy Addons/Plugins: what the Main has loaded is loaded on the Alt (nothing
; unloaded), each addon's settings for the Main's character are made the Alt's (the Alt's old files kept in
; config\before-copy\), and the addons' windows go where the Main has them.

[discord]
; Discord Rich Presence: your Discord profile shows the game, your character's name, main and sub job and levels
; (WAR75/NIN37), the zone, and how long you've played since logging in; "Character select" before that. Needs the
; Discord app running on this PC: VanaCore looks for it every 15 seconds. Changes apply while the game runs. From XI on
; Anything (rubymatrix/xi-on-anything).
; 1 shows it; 0 clears it and lets go of Discord. /vana > Client > VanaCore > Discord status. Default: 1
;enabled=0
; 0 leaves your character's name out: the jobs and the zone only. /vana > Client > VanaCore > Show character name.
; Default: 1
;name=0

[mcp]
; An MCP server in the game, for AI tools such as Claude Code on this machine: they read and write
; the game's memory, disassemble its code, set hardware breakpoints, see its entities, packets,
; chat and screen, and run Lua and commands in it. On 127.0.0.1 only. Connect with:
;   claude mcp add --transport http vanacore http://127.0.0.1:47800/mcp
; 0 turns the feature off for good, for a server that doesn't want AI tools in its players' games: the
; server never starts, whatever enabled says, and the /vana window shows no AI MCP rows. Anyone can set it
; back to 1. Default: 1
;available=0
; 1 starts it; 0 stops it (also while the game runs: VanaCore looks every 2 seconds). Default: 0
;enabled=1
; Its port (the next free one if a second game has it). Default: 47800
;port=47800
; Clients must send "Authorization: Bearer <token>" when this is set. Default: none
;token=

[logging]
; 1 turns logging on: logs\vanacore.log, its lines in the console with attached=1, the DLSS helper's logs\dlss.log, crash
; dumps (crashdumps, below). 0 logs, prints and dumps nothing. /vana debug's and /vana abtest's own files (logs\frames-*.csv,
; logs\debug-*.log, logs\abtest-*.log) are kept either way. Applies while the game runs (/vana logs on|off does the same);
; crash dumps and the DLSS helper's log follow the next start. A vanacore.log past 8 MB is renamed to
; vanacore-<date time>.log at the next start (never deleted). Default: 1
;enabled=0
; When the game crashes: 0 one log line; 1 a full report in the log plus logs\crash-*.dmp
; (15-40 MB); 2 as 1, with all of the game's memory in the dump (hundreds of MB). Default: 1
; (Not for the two minutes after /shutdown: the game's teardown faults every time; one log line.)
;crashdumps=1
; 1 logs a line every 10 seconds on where the game's frames go (its work, its sleeps, VanaCore,
; Present). Needs a restart, and adds a little overhead. Default: 0
;frametimes=1
; GPU crash data (renderer=d3d12): 1 has Windows keep how far the graphics card got through its work, so if it stops
; (a driver timeout - AMD's "driver timeout" message - or a bad address) the log says which pass (the scene, shadows,
; bloom, the interface, ...) and which operation it stopped at, and what was at a bad address. Why the card stopped is
; logged either way. A little slower: on to catch a crash, then off again. Needs a restart. Default: 0
;gpu=1
; 1 logs the game's cursor and window calls (GetCursorPos, ScreenToClient, GetWindowRect, ...) and its mouse messages,
; the first few of each and then one a second, up to 3000 lines: for mouse bugs. Hooks those calls, so off when not in
; use. Needs a restart. Default: 0
;mouse=1
; 1 writes a timeline of each zone change to its own file (logs\zoneload-<time>.log): the packets in and out while
; it waits for the server, the files the zone reads, the frames. From the next zone change. Default: 0
;zoneload=1
; Addons to trace, by folder name, comma separated: for one that "doesn't work" with nothing in the log. Each is logged as
; "Trace <addon>: ..." in logs\vanacore.log: when it loads and what it listens for; each command line (and whether it reached the
; addon or VanaCore, an /alias or a plugin took it first); each ImGui window it draws (open, shown, collapsed, where, how big, off the
; screen, whether anything was drawn inside, and when it stops being drawn); the packets it adds and blocks, and whether they went
; out; the chat lines and commands it writes; and a line every 10 seconds of what ran. In game: /vana trace partyfinder, /vana trace off,
; /vana trace list (also written here). Needs logging on. Costs nothing while empty. Default: none
; /vana trace sidekick 30 traces it for 30 seconds (not written here) and writes logs\trace-sidekick-<date>-<time>.txt: what its
; Lua costs a frame, by event, its slowest calls, memory and profile, and the game's frames and hitches beside it.
;trace.addons=partyfinder
; Each of these is a switch in the /vana window's Client > Developer > Logging, and in the launcher's VanaCore settings > Logging.

[language]
; The game's text language: 1 Japanese, 2 English. Default: 0, the game's own setting.
;playonline=1

[ffxi.registry]
; The game's settings by the registry value names the game reads them by. [ffxi] names every one
; that does something known; this is for the rest. For a value both set, [ffxi]'s wins, or this
; section's with [ffxi] registry.override=1. Either wins over [ffxi]'s defaults. -1 or empty doesn't
; set it. Whole numbers reach the game as numbers, anything else as text.
; [ffxi]'s names for them: 0000 mipmap, 0001/0002 resolution.game, 0003/0004 resolution.background,
; 0007 sound.enabled, 0011 env_anim_mode, 0017 bump_mapping, 0018 texture_compression,
; 0019 map_compression, 0021 hardware_mouse, 0022 opening_movie, 0023 simple_char_creation,
; 0028 gamma (here as the float's 32-bit pattern in decimal), 0029 sound.max_sounds, 0030 lcd_3d,
; 0034 mode, 0035 sound.background, 0036 font_compression, 0037/0038 resolution.ui, 0039 ime_mode,
; 0040 graphics_stabilization, 0041 beta_ui, 0042 screenshot.path, 0043 screenshot.screen_resolution,
; padmode000 gamepad.mode, padsin000 gamepad.buttons, padexsin000 gamepad.buttons_ex,
; padguid000 gamepad.guid.

; Read by the game, meaning unknown. These are a normal install's values (0031 is the float 0.006).
;0020=1
;0024=0
;0031=1002740646
;0032=0
;0033=0
; Cafe is read too, meaning unknown, and a normal install doesn't have it.
; Never read by this client, so they do nothing here: 0005, 0006, 0008-0010, 0012-0016, 0025-0027,
; 0044 (keeps the window's aspect ratio in clients that read it), 0045.
