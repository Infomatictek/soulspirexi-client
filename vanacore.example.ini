; and the pearl hangs to their left. Changes while the game runs. Default: 1
;nameplates.center=0
; 1 applies the centring above, the pearl's, plate's, name's and stars' offsets and the pearl's size to players'
; names only (yours and other players'): NPCs, monsters, trusts and pets stay as the game draws them. Changes
; while the game runs. Default: 1
;nameplates.characteronly=0
; Parts of the plate moved, in the same units as the pearl (-100 to 100, at nameplates.size 1; x above 0 right, y
; above 0 down, scaling with the name): plate moves the pearl, letters and stars together; name just the letters
; (the pearl and stars stay); stars the job master's stars under it. Each is added to the plate's. Changes while the
; game runs. Defaults: 0 but stars 1, 20
;nameplates.plate.x=0
;nameplates.plate.y=0
;nameplates.name.x=0
;nameplates.name.y=0
;nameplates.stars.x=0
;nameplates.stars.y=0
; The job master's stars that share (%, 0 to 200) of the game's distance apart, about the line's middle, and this many
; times their size (0.25 to 3), the line grown about its middle. Changes while the game runs. Defaults: 40, 0.65
;nameplates.stars.spacing=100
;nameplates.stars.size=1.5
; The names' size, times the game's (0.25 to 4). Changes while the game runs. Default: 1
;nameplates.size=1.25
; 0 sizes names by distance as the game does, in 80 whole steps of it (walking up to someone or zooming, their name
; grows a step at a time); 1 sizes them smoothly from the same distance. Changes while the game runs. Default: 1
;nameplates.smooth=0
; How much names shrink with distance, 0 to 100 (%): 100 as the game shrinks them, 0 not at all (a name 10 yalms off
