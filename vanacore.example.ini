; The numbers and "Miss!" the game floats over characters as they're hit: game draws them from its own pictures of
; them (ROM\119\51.DAT's "menu dmgnum", 22 x 37 texels a digit, blown up to the world's size, so they're soft);
; sharp (True Font in /vana > Game Options > Damage Numbers) draws each as VanaCore's own text at the screen's pixels,
; centred where the game centres its digits, at their height (damage.textsize times it), fading and rising as the
; game's do, in damage.family, bold and italic by damage.bold and damage.italic. Default: game
;damage.font=sharp
; The numbers drawn over everything (game and sharp alike), so party members and other characters in front of the
; target and the names over heads don't hide them; 0 lets what's in front cover them, as the game does. Default: 1
;damage.ontop=0
; How long a number stays up, in seconds (game and sharp alike), rising as far as the game's do over it (0.5 to 10).
; The game keeps them 150 frames of 60 a second; VanaCore points the game's own count at this. Default: 2.5
;damage.duration=4
;damage.family=Segoe UI
;damage.bold=1
;damage.italic=1
; sharp's size next to the game's digits (0.5 to 3). Default: 1
;damage.textsize=1
; sharp's dark outline: 1 is a pixel at 12 pixels high, two at 24; 0 none (0 to 4). Default: 1
;damage.outline=1
; sharp's size kept to at least damage.min and at most damage.max pixels (the font's size), so far-off numbers stay
; readable and close-up ones don't fill the screen; 0 no limit. Default: 0, 0
;damage.min=14
;damage.max=96
; sharp writes 1,337 for 1337. Default: 0
;damage.commas=1
; sharp writes MISS! for Miss!. Default: 0
;damage.misscaps=1
; Critical hits: the number in damage.crit.color (game's glyphs too), damage.crit.size times bigger (sharp). Found
; from the server's action packets (0x028: message 67 or 353, or the hit's critical effect), matched to the number by
; its target and amount. Default: 1, #FFD040, 1.3
;damage.crit=1
;damage.crit.color=#FFD040
;damage.crit.size=1.3
; sharp writes a critical hit with two exclamation marks: 1200!!. Default: 0
;damage.crit.exclaim=1
; Where a number first appears (game and sharp alike). damage.spawn=game puts it where the game does; stacked puts the
; numbers for one target that come within 0.7 s of each other one above the next, damage.spread apart; random puts each
; anywhere within damage.spread of the game's spot, so they don't sit on top of one another. damage.offset.x and .y
; move every number right and up (negative: left and down). All in digit heights (the number's own height, so they
; scale with distance). Defaults: game, 0, 0, 1 (spread 0 to 10, offsets -10 to 10)
;damage.spawn=random
;damage.offset.x=0
;damage.offset.y=0.5
;damage.spread=1
; Colours (#RRGGBB) for the numbers the game colours itself (a monster you've claimed's red, a miss's green, a hit
; on you white): damage.color every hit, damage.miss.color Miss!, damage.taken.color a hit on you (over damage.color),
; damage.heal.color HP recovered (a heal is never a hit or a hit taken). A critical hit keeps damage.crit.color. Unset or
; game: the game's. Default: game
;damage.color=#FF8282
;damage.miss.color=#9CFF9C
;damage.taken.color=#FFFFFF
;damage.heal.color=#B0FFB0
; sharp writes HP recovered with a plus in front: +530. Default: 0
;damage.heal.plus=1
; sharp: each kind's gradient, <kind>.gradient=1, fades it from its colour (the game's while that's unset) to
; <kind>.color2: damage.gradient and damage.color2 for hits, damage.miss.*, damage.taken.*, damage.heal.* and damage.crit.*
; (a critical hit's while damage.crit is on). A hit on you with neither a colour nor a gradient of its own takes a hit's.
; damage.gradient.direction=vertical runs every gradient from the digits' top to their foot, horizontal from left to
; right. Default: 0; color2 #C81E1E (hits), #2E9E4A (misses), #9AA4B4 (on you), #2EA860 (heals), #FF6A00 (critical); vertical
;damage.gradient=1
;damage.color2=#C81E1E
;damage.crit.gradient=1
;damage.crit.color2=#FF6A00
;damage.gradient.direction=horizontal
; sharp's outline in a colour of its own (#RRGGBB). With it or a gradient set, every number is drawn in its own
; colours rather than tinted. Unset: the dark outline. Default: unset (black)
;damage.outline.color=#401000
; sharp: a round of several hits on one target (a double attack, a dual-wield round, a weapon skill's hits: the
; server's action has several results for the target) gets an icon to the right of each of its numbers:
; damage.multi.icon=swords (crossed swords) or count (x2, the hits in the round), damage.multi.size times the
; number's size (0.2 to 2). Default: 0, swords, 0.6
;damage.multi=1
;damage.multi.icon=count
;damage.multi.size=0.6
; sharp: the name of the weapon skill, spell or job ability that did a hit written above its number, damage.label.size
; times the number's size. Auto-attacks and a monster's moves have none. Default: 0, 0.5
;damage.label=1
;damage.label.size=0.5
; The Test buttons under /vana > Game Options > Damage Numbers > Placement show numbers VanaCore makes itself over the player
; (the game's come only with a real hit's animation), placed by the spawn style and offsets with the colours, icon and
; skill name set, floating up and fading over damage.duration: one hit, three hits of a weapon skill, or a fight of nine.
; sharp: sample numbers (1337 with a skill name, Miss!, a critical 2048, a hit of a multi-hit round, 86) across the middle
; of the screen, to see the look while changing it; their colours are near the game's, their size that of the last
; numbers seen in a fight (a digit 1.7% of the screen's height before any). Default: 0
;damage.preview=1

; Zone lines: the boxes the zone's DAT marks as lines to other zones, drawn as glowing curtains (renderer=d3d12
; or d3d11, with effects on), read again at each zone change. 0 hides them. Default: 1
;zonelines=1
; Their colour (#RRGGBB) and how strongly they're drawn (0 to 1). Defaults: #60C0FF, 1
;zonelines.color=#60C0FF
;zonelines.strength=1
; How they're drawn: fill a glowing curtain, line a line floating across them (a unit above their middle), dots
; that line dotted, stars sparkles drifting up them, floor dots lying on the ground inside them (wherever the
; box's middle is: for a zone whose boxes sit low or high); glow 1 a halo round them (0 none). Defaults: dots, 1
;zonelines.style=dots
;zonelines.glow=1
; The line's and dots' height above the ground under each zone line (from the zone's collision; where that gives
; none, a unit above the box's bottom), where the stars start (world units, -10 to 10), and the lines', dots' and
; stars' size (0.25 to 4 times their own). Defaults: 1.5, 1
;zonelines.height=1.5
;zonelines.size=1
; How far (world units, 0 to 10) they fade out toward where they stop: the walls either side, or the zone
; line's own ends. 0 stops them sharp. Default: 4
;zonelines.fade=4

; Sparkles: small points of light rising out of places on the ground, twinkling and gone before the top
; (renderer=d3d12 or d3d11, with effects on). 0 hides them. Default: 1
;sparkles=1
; How bright (0 to 2), their size (0.25 to 4 times their own), how many (0.1 to 4 times) and how fast they rise
; and come and go (0.1 to 4 times). Defaults: 1, 1, 1, 1
;sparkles.strength=1
;sparkles.size=1
;sparkles.density=1
;sparkles.speed=1
; 1: each takes the colour of the spot it rises from, as the scene shows it; 0: its place's colour. Default: 1
;sparkles.match=1
; Where they rise: zone:x,y,z,radius,height[,#RRGGBB], a ; between places (8 at most in a zone). x, y and z
; are the ground at the middle as the game has a character's position (z its height), radius the disc they
; rise from, height how high they rise. Default: the Nyzul Isle portal
;sparkles.places=72:20,-20,-4.75,4.5,3.5,#A8E8FF

; The effect trusts arrive with. The server marks every update about a trust with it, so walking up to
; someone with trusts out plays it for each at once: cast leaves it to trusts seen being summoned (their
; casting seen, yours or anyone's), always plays it as the server sends it, never for none. Changes while
; the game runs (any renderer). Default: cast
;trusts.spawn=cast
; The glow round trusts and avatars (renderer=d3d12 or d3d11). The game makes it from a 256x256 picture of
; the character, which with a large background resolution is a blur: a size (256, 512, 1024, up to 4096)
; draws that picture at it. custom is VanaCore's own glow (the character's full-size picture blurred, in the
; game's tint; one pass where the game's takes eight); off leaves it out (the character crisp). Changes while
; the game runs. Default: custom
;glow=custom
; With glow=custom: how strong the glow is (0 to 4; 0 hides it, 1 is the game's tint) and how wide (0.1 to 4 times the
; blur's reach: 2 doubles the halo, 0.5 halves it). Change while the game runs. Defaults: 1, 1
;glow.strength=1
;glow.size=1
; How smooth a big glow is: 0 low, 1 medium, 2 high, 3 max. A wide glow's blur shows as stepped copies of the character;
; higher qualities keep its steps finer (blurring from a smaller, averaged picture) and blur again (2 and 3 rounds).
; Medium is as it was at size 1. Default: 1
;glow.quality=1
; Character brightness (renderer=d3d12 or d3d11): the light on players, NPCs and monsters times this, 0 to 10,
; so they stand out at night and in caves while the zone stays as it is. Their brightest parts are as bright as
; the game lets them get, so it shows most where they're dim. Below 1 they are dimmed as they are drawn instead (their
; light taken down first made white clothing flicker on a running character). Changes while the game runs. Default: 1
;characters.brightness=1.5
; Character ambient light (renderer=d3d12 or d3d11): the least ambient light on players, NPCs and monsters, 0 to 2, as
; Force ambient light but for the characters only: their ambient is raised, each channel by the same amount, until its
; brightest is at least this, so they are never darker than that in a cave or at night while the zone stays as it is.
; 0 is off, 1 lights them so their textures show as they are (the game's neutral), with the light's shading still on top.
; Above 1 it overexposes them, washed out at 2. Changes while the game runs. Default: 0
;characters.ambient=0.4
; Untextured (renderer=d3d12 or d3d11): the world's solid surfaces drawn plain white in place of their textures, so only
; the light, the shadows and the vertex colours show - for looking at the lighting without the pattern under it. Leaves,
; fences, effects and water keep their textures so their shapes stay; the interface is as it is. Changes while the game
; runs. Default: 0
;untextured=1
; Collision (renderer=d3d12 or d3d11; /vana debug's "Show collision"): the zone's collision, read from its DAT, drawn over
; the world see-through, behind what's nearer: walls red, floors by the ground the footsteps sound for (object purple, path
; tan, grass green, sand yellow, snow white, stone orange, metal pink, wood brown, shallow water cyan, deep water blue). For
; that game only (never saved, as debug). Default: not shown
;collision.show=0

; Grass (renderer=d3d12 or d3d11; a prototype): tufts of grass scattered over the zone's grass-textured ground round
; you, where the ground's own texture is green. They sway, fade in toward the edge of grass.radius and stand on the
; ground the game draws (its culling and draw distance), so nothing is made behind a wall or a hill. Changes while the
; game runs. Default: off
;grass=1
; The ground textures that are grass, as hex hashes (see grass.log); empty, any mostly green one. Default: empty
;grass.textures=
; The yellow-olive of dry grass (East Sarutabaruta's) counts as grass too, not only green, on ground that is dry grass
; (not a path's greyer olive dirt, nor the dirt in green grass); 0, green alone. Outdoors only: not in a Mog House or a zone
; with no sky. Textures that are never grass, whatever their colour, are listed in addons\vanacore\vana\data\grass_dirt.json
; ("not_grass": the top level's in every zone, a zone's own in it). Default: 0
;grass.dry=0
; Mega dense: on ground the zone's collision calls grass (where your footsteps sound as grass), every spot grows, whatever its
; texture's colour there, with no path padding or shortening at the texture's own edges; 0, only its green spots. Default: 0
;grass.mega=0
; In grass ground, the parts in shadow (too dark to read as any colour) and the yellow-olive of dry grass, as saturated as
; dry grass is, grow too, not only the green parts (Bhaflau Thickets' forest floors are green on a third of their texels);
; a path's greyer olive dirt still doesn't. 0, the green parts alone (and the yellow-olive on dry grass ground). Default: 1
;grass.shade=1
; Where dry grass's yellow-olive starts: its least mean saturation over a texture (0.05 to 1; a path's olive-grey dirt is
; about 0.24, Batallia Downs' and Wajaom Woodlands' floors 0.28 and 0.29, East Sarutabaruta's grass 0.39) and its reddest
; hue in degrees (1 to 70; tan dirt is under 42, East Sarutabaruta's pale straw 28 to 39). Defaults: 0.25 and 30
;grass.dry.saturation=0.25
;grass.dry.hue=30
; Grass-textured ground the game draws blended is ground too: a layer it lays over other ground (The Sanctuary of Zi'Tah's
; moss over its soil), growing as much as the layer shows of itself. 1 every zone, 0 none. Default: unset, each zone as
; addons\vanacore\vana\data\grass_dirt.json says ("blended": true; /vana grass reload reads it again). The same file lists a
; zone's own grass ground, textures that are grass there whatever their colours say ("ground": [ hashes ]: Zi'Tah's dark
; leaf-litter floor, too dark for the colour tests)
;grass.blended=
; Tufts only on ground you could stand on: where the zone's collision has a floor of path, grass, sand, snow, stone or
; shallow water (the ground the game's footsteps know), not on carts, crates, fences, trees, roofs or river beds; ground
; out of reach (the hills round a zone) keeps its grass. The floors are read from the zone's DAT. 0, any grass ground.
; Default: 1
;grass.walkable=1
; No grass on ground the zone's collision calls shallow water (where the game's footsteps splash: the meadow under Dragon's
; Aery's waterfalls, Pashhow's marsh), whatever grass.walkable is. 0 grows it there as on grass (/vana's "No grass in
; water"). Default: 1
;grass.nowater=1
; With grass.nowater, that shallow water grows low cushions of moss instead of staying bare, coloured from the ground as the
; grass is (/vana's "Moss in water"). Default: 0
;grass.moss=0
; Whatever grass.walkable is, no grass grows under a floor laid over the ground within the tallest tuft's reach (a building's
; floor over the ground the game draws on under it). grass.cover.show=1 draws that grass red instead of leaving it out, and
; the grass with no floor at or under it to tell yellow (/vana's Debug window, Grass tab), for that game only (never saved,
; as debug). Default: not shown
;grass.cover.show=0
; An easter egg: dry grass also grows on floors coloured like it that the game's footsteps call stone or metal throughout
; (the gold of the Nyzul portal in Alzadaal grows a meadow). 0, dry grass ground grows only where the zone's floors under
; it are path, grass, sand or snow somewhere nearby (shallow water too with grass.nowater=0). Needs grass.walkable. Default: 0
;grass.overgrown=0
; While the free camera is on (/freecam), the grass grows round the ground under the camera instead of round you, so a
; flight over a field has grass all the way (fast flight can outrun it: grass.build fills it in sooner). 0 keeps it round
; you. Default: 1
;grass.freecam=1
; (/vana shows the range in tens of yalms, the quantity as a percent and the height as a percent: 0.1 tall is 1%, 1.5 100%.)
; How far round you it reaches (4 to 500), how many tufts to a square yalm of ground (0.1 to 100: /vana's Quantity; the
; tufts made follow it and the range, about 0.3 MB of video memory a thousand), a ceiling on the tufts made at once, in
; thousands (unset or 0, none; 1 to 1000: 1000 is a million, the most there can be; past it the grass thins evenly;
; grass.limit, in tufts, is read while it's unset; moving /vana's Quantity takes both out), how tall they
; stand and how wide (the height only changes how tall), how much the heights differ from tuft to tuft (0 to 1), how
; bright they are against the ground, how many tufts have a flower (0 to 1: 1 one in ten, 0.1 one in a hundred; they grow
; in patches, a colour a patch) and how bright the flowers are. Costs frame rate as it grows.
; Default: 150, 100, 0, 0.4818, 1, 0.5, 1, 0, 1
;grass.radius=150
;grass.density=100
;grass.tufts=0
;grass.height=0.4818
;grass.width=1
;grass.variation=0.5
;grass.brightness=1
;grass.flowers=0
;grass.flower_brightness=1
; 1 dims the grass and flowers by the Vana'diel time of day, so they don't glow against the darkened ground at night: their
; whole brightness at noon, grass.brightness.night times it at midnight (0.05 to 1), halfway between at 6:00 and 18:00, a
; little more or less every minute. The clock is the server's. Changes while the game runs. Default: 1, 0.5
;grass.brightness.auto=1
;grass.brightness.night=0.5
; The rings: the grass is thinner the farther it is from you, so grass.radius can reach farther for the same tufts. Ring 1,
; 2 and 3 each start at a percent of grass.radius (0 to 100, outward in order) and keep a percent of the tufts there (0 to
; 100, each no more than the ring inside it); inside ring 1 every tuft grows. The steps blend over a tenth of the radius,
; and the tufts kept farther out are among those kept nearer in, so walking toward a field only adds grass. 100 for all
; three amounts turns the rings off. grass.ring.spacing (1 to 100; /vana's Draw distance detail) puts the three at it, twice it and three times it;
; grass.ring1-3 put one where it says instead. grass.rings.show=1 draws them round you (/vana's Debug window, Rings tab: 1 green, 2 yellow,
; 3 orange, where the tufts start to shrink blue, the radius red), for that game only (never saved, as debug).
; Default: spacing 25 (25, 50, 75), keeping 80, 50, 30; not shown
;grass.ring.spacing=25
;grass.rings.show=0
;grass.ring1=25
;grass.ring1.amount=80
;grass.ring2=50
;grass.ring2.amount=50
;grass.ring3=75
;grass.ring3.amount=30
; The steepest ground it grows on, in degrees (5 to 85; /vana's Max slope angle, under Advanced Settings): it thins out and
; shortens toward that, so cliffs and rock faces stay bare. Default: 40
;grass.slope=40
; Near the brink of a drop steeper than that (a ledge, a rock's top), the tufts grow smaller, so none hang out over the
; edge. Default: 1
;grass.edges=1
; Grass this near where it ends, in yalms (0 to 10; /vana's Shorter near edges), grows shorter toward the edge: a drop, ground
; steeper than grass.slope (a hill drawn apart from the grass too, by the zone's collision), a rock's or stone's floor after
; soil, the ground's texture turning from grass. Climbing from half grass.slope to grass.slope it shortens the same. 0 off.
; Default: 2
;grass.edge.fade=2
; How tall it is at the edge itself, percent of its height (5 to 100; /vana's Height at edges). Default: 25
;grass.edge.height=25
; Keeps grass this far back from a path, in yalms (0 to 4), so paths read wider: no tuft grows with the path's bare ground
; within that distance. 0 leaves the grass up to the path's edge (/vana's Path padding, under Advanced Settings). It's the
; default for the zones addons\vanacore\vana\data\grass_dirt.json gives no "pathpad" of their own; a zone's own always wins
; (0 where a zone has no paths, as Wajaom Woodlands; the slider is locked there). Unset, that file's top-level "pathpad".
; Default: 0.25
;grass.pathpad=0.25
; How long a frame spends making the squares of grass as you come up to them, in milliseconds (0.1 to 50): the rest of a
; square waits for the next frame, its thinner tufts from farther off drawn meanwhile. -1 makes every square the frame it's
; in reach, which hitches the frame in a wide field. Default: 1.5
;grass.build=1.5
; 1 doesn't draw a square of grass wholly outside the camera's view (behind or beside it); it's still made and kept, so it
; shows at once when the camera turns to it. 0 draws every square in reach (/vana's Grass culling). Default: 1
;grass.cull=1
; How far the grass and plants take the colour of the ground under them, lit as the game lights the ground, 0 to 1:
; 0 their own colours (the drawn blades the ground's, in their own darker shade), 1 the ground's. Default: 0.75
;grass.match=0.75
; The wind the grass sways in, each 0 to 4 and each times its usual: how fast it sways (0 stills it), and how much the sway
; differs from place to place (low, the whole field moves together in long waves; high, it ripples; 0 moves it as one).
; Changes while the game runs. Default: 1, 1
;grass.wind.speed=1
;grass.wind.turbulence=1
; 1 grows flowers alone, no grass (flowers then also grow outside their patches, thinner). Default: 0
;grass.flowers_only=0
; What grows: the catalogue. The drawn blades, Type 1 (id blades1: eight wide, straight blades) and Type 2 (id blades: the
; finer, curved ones), VanaCore's own plants (addons\vanacore\vana\grass\<id>.json) and your own library
; (config\grass\<id>.json, made by /vana grass capture beside some grass or shrubs: the plant sprites drawn around
; you). Each of those is a recipe: the DAT and texture its sheet is in, read from your own game files (no
; game art ships with VanaCore); a captured sheet no game file has is kept as a PNG beside its .json. grass.asset.<id>=1 grows one, and
; grass.asset.<id>.amount (0 to 100) is its share of the mix: 70 and 30 grow seven of the one for three of the other.
; /vana grass list shows the ids. Default: each one's "default" in its .json (0 without one), the drawn blades' their own:
; Type 1 20, Type 2 100, Ru'Aun Gardens tall grass 100, small plants 35, the rest off (0). The eye on a plant's row in /vana
; grows it alone, whole, till it's clicked again or the window closes (never saved)
;grass.asset.blades=1
;grass.asset.blades.amount=100
;grass.asset.blades1=1
;grass.asset.blades1.amount=20
;grass.asset.ruaun-grass=1
;grass.asset.ruaun-grass.amount=100
;grass.asset.ruaun-plants=1
;grass.asset.ruaun-plants.amount=35
; 1 writes what it finds to the log ("grass:" lines) and the ground textures it takes for grass to logs\grass\<hash>.bmp.
; Default: 0
;grass.log=1

; Addons' widgets in the world (vana.world.place, docs\addons\18-widgets.md): 1 writes a "Widgets: watch:" line to the log
; for each frame that draws them unlike the frame before - the names' pass walked twice (the extra walk left out), a
; different number of boxes drawn, other sizes, or the camera moved between the names' pass and the interface. For a
; widget that flickers or doubles for a frame. 20 lines a minute at most. /vana > Client > Developer > World widgets.
; Changes while the game runs. Default: 0
;widgets.log=1

; Snow trails (renderer=d3d12 or d3d11, experimental): footprints pressed into snow where players, NPCs and monsters walk.
; Only ground the zone's collision calls snow (the footstep kind the game plays for it) takes them. Nothing is dug: they're
; shading laid over the snow the game draws (the dent's walls lit or shaded by the sun, the shadow of its rim, a little
; occlusion at the bottom, a lip of snow pushed up round it), out to about 16 to 28 yalms round you. Each foot is the size
; and place of the character's own, read from its model as the game draws it. A print is shaded once, as it's pressed in,
; with the sun's light as it was then (taken once in a zone and kept) and the settings below as they were; it never changes
; after, but for filling in. Reads the zone's collision, as grass.walkable does. Changes while the game runs. Default: 0
;snow=1
; How deep a print is pressed in, in yalms (0.02 to 0.5): how steep its walls look, so how lit and shaded they come out.
; Default: 0.12
;snow.depth=0.12
; How strongly the prints are shaded (0 to 2; 0 none). Default: 1
;snow.strength=1
; Seconds a print takes to fill in with snow again (0 never; at 0 they stay until you leave the area or zone). Default: 120
;snow.fade=120
; How soft the prints' edges are (0 to 1): the heights are blurred before they're shaded (up to 8 texels of 1/32 yalm) and the
; walls and the lip made wider, so the lines don't come out sharp. Default: 0.6
;snow.soft=0.6
; How far a character standing in snow is lowered into it, in yalms (0 to 1; 0 off): the model is drawn that much lower, its
; feet hidden by the snow's surface, fading in and out as it steps on and off snow. A player's; others by their feet's size.
; Default: 0
;snow.sink=0.15

; VanaCore's sky (renderer=d3d12, experimental): drawn in place of the game's sky dome, the bands of colour round the camera
; from the horizon up that the game draws first each frame. For now it's the dome's own colours drawn again by VanaCore, so
; it should look the same (True Sky's first step: its own sky, clouds and rain come later). The game's clouds, sun, moon,
; stars and distant scenery stay the game's. Direct3D 11 keeps the game's dome. Changes while the game runs. Not in /vana
; until it looks different from the game's sky: for testing. Default: 0
;sky=1
; A line in vanacore.log as VanaCore's sky takes the game's dome, or leaves it and why. Default: 0
;sky.log=1

; Water (renderer=d3d12 or d3d11): VanaCore's own water on the zone's flat water tiles (Bastok Markets') and, with water.detect,
; the game's level water models (the sea, ponds, rivers), shaded with travelling waves and fine ripples, the bed showing
; through by its depth, the sky mirrored in it and the sun's and moon's glint, in place of the layers the game draws over
; its tiles (which changed from blue to black as the camera moved). 0 leaves the game's. Changes while the game runs. The
; zones addons\vanacore\vana\data\water_zones.json says "water": false of keep the game's whatever this says (the Sea of
; Al'Taieu's zones and those with no water at all: Alzadaal, the Promyvions, most dungeons); read again once it changes, at
; the next zone change. Default: 0
;water=1
; How steep the waves are (0 flat to 4), how fast they travel (0 to 5), how long they are (0.25 to 4), how much of the sky
; shows in the water (0 to 3), how strong the sun's and moon's glint is (0 to 4), the brightness of the water's own colour
; (0.1 to 4), its colour from 0 blue through 0.5 teal to 1 green, and how much of the lighter, shallow colour shows (0 to 3).
; Default: 1, 1, 1, 1, 1, 1, 0.5, 1
;water.waves=1
;water.speed=1
;water.size=1
;water.reflection=1
;water.glint=1
;water.brightness=1
;water.colour=0.5
;water.shallowness=1
; How much the small ripples add to the long swell (0 to 4), the waves' direction in degrees (0 to 360), and how wide the
; glint is (0.2 to 4). Default: 1, 0, 1
;water.turbulence=1
;water.direction=0
;water.glint.size=1
; The water's own colour as #RRGGBB, as it looks in the shallows (the deep is a darker one of it); with it, water.colour is
; not used. Empty, the blue to green colour above. Default: empty
;water.tint=#0F3D42
; The water pass: 1 draws the water after the rest of the world, over copies of the scene's colour and depth, so what's
; under the surface shows through where the water is shallow and the water's own colour takes over as it deepens, with a
; soft edge where the bed rises to the surface at the shore; 0 draws it in its place in the world, opaque, as before.
; Default: 1
;water.pass=1
; With the pass, experimental: the sea drawn on past the zone's edge to the horizon, where the game paints its sea on
; the sky's dome (Valkurm Dunes): a flat sheet at the shore's level from the zone's collision box out past the fog. Off
; by default: beside the game's bright painted sea it reads as a second, darker sea, with a step where its rings meet
; and the painted band still above the true horizon. VanaCore's sea (water.sea) goes past the game's draw distance with
; it, out to the horizon (the ferries with Boat rides at 1x). Default: 0
;water.horizon=0
; With the pass: the sun's shadows fall on VanaCore's water (1); 0 leaves the water out of them. Default: 0
;water.shadows=0
; With the pass: the game's sea (its tiles at the sea's level, in the zones whose water reaches the zone's edge) dropped and
; VanaCore's own sea drawn in its place, one plane across the zone and on to the horizon (1); 0 keeps the game's tiles.
; Ponds, lakes and streams are left as they are. Default: 1
;water.sea=1
; With the pass: how far into the water one sees, in yalms (0.5 to 20; the bed is half gone at about this depth, and its
; colour goes blue-green on the way, red first), how much the waves bend what shows through (0 none to 3), how wide the
; soft edge and the foam at the shore are, in yalms (0 none to 3), and how strong the foam is (0 none to 3).
; Default: 4, 1, 0.5, 1
;water.depth=4
;water.refraction=1
;water.shore=0.5
;water.foam=1
; With the pass: how strongly a waterfall churns and foams the water it lands in, where the game's waterfall (a tall
; draw of its water models) ends at VanaCore's water (0 none to 3). Default: 1
;water.falls=1
; With the pass: the rippling light on the bed in shallow water by day (0 none to 3), and how much the wavelets are lit as
; slopes, crests bright and troughs dark, bending what shows through with them (0 a flat sheet to 3). Default: 1, 1
;water.caustics=1
;water.relief=1
; With the pass: the world mirrored in the water. The shore, trees, walls, cliffs and characters above a level of water are
; drawn again upside down into a smaller picture, which the water at that level shows in place of the sky's colour wherever
; the world stands in it, pushed about by the waves. water.mirror is how strongly (0 off to 2, a full mirror);
; water.mirror.scale the mirror's size as a share of the scene's each way (0.25 to 1: lower is softer and cheaper);
; water.mirror.reach how far from the camera what's mirrored reaches, in yalms (0 everything drawn; lower is cheaper);
; water.mirror.waves how far the waves push the mirrored picture about (0 a still mirror to 4). One level of water is
; mirrored each frame, that of the water nearest the camera (a lake's, a pond's, the sea's): water at another level keeps
; the sky alone. The sky in the water is the picture's own sky too (its clouds, a dusk's colours) wherever the mirrored
; direction is on the screen. Only solid things are mirrored besides: no spell effects or see-through layers, and nothing
; the game hasn't drawn that frame (what lies wholly out of the camera's view). Default: 1, 0.5, 300, 1
;water.mirror=1
;water.mirror.scale=0.5
;water.mirror.reach=300
;water.mirror.waves=1
; VanaCore's own rain while the weather is rain or squall (and thunder, with rain.thunder: a look alone, the weather stays
; thunder): streaks on layers out from the camera that the world and the characters hide, none under roofs, bridges and
; caves (rain.shelter: the zone's collision cast down), splashes where the drops land on what faces up - the ground and the
; characters' shoulders - with a crown that rises off the surface (rain.splash, 0 none to 3), a wet sheen on the ground.
; rain.density (0.2 to 3) is how much falls. Defaults: 1, 1, 1, 1, 1
;rain=1
;rain.density=1
;rain.splash=1
;rain.shelter=1
;rain.thunder=1
; How big the spatter is that the drops throw off the characters' heads, shoulders and arms where they hit (0 none to 3,
; 1 a fine spray; rain.splash is how often). Default: 1
;rain.spatter=1
; The rings the drops make where they land on VanaCore's water (lakes, ponds, streams, the sea; the water pass's): each a
; ring that spreads a hand's width and fades, with a fainter one after it, none under a roof or a bridge (rain.shelter),
; none past rain.range; more of them with rain.density, stronger with rain.splash (0 none to 3). Default: 1
;rain.water=1
; How far round the camera the drops fall and land with a splash, in yalms (8 to 32); past it only the far rain falls, with no
; splashes. Further costs more (the drops go with the area). Default: 16
;rain.range=16
; The game's own faint rain (six sheets round the camera) is left out while VanaCore's draws; rain.game=1 keeps it under.
;rain.game=0
; Droplets on the lens while the rain reaches the camera: each lands as a hit and sits as a bead with the scene upside down in
; it, the big ones sliding off down a rivulet, the small ones drying; none under a roof, all gone after the rain. How many
; (0 none to 3, 1 a wet windscreen). Default: 0.5
;rain.lens=0.5
; rain.lens.on=0 leaves the lens dry whatever rain.lens is (kept for when they're back). Default: 1
;rain.lens.on=1
; The wet ground: darker, the sky in it and puddles in the flats while it rains, wetting and drying off as the characters do
; (over some 12 seconds in, rain.dry out). rain.ground=0 leaves the ground as it is. Default: 1
;rain.ground=1
; The rain on the characters: while the weather is rain or squall, players, NPCs and monsters are drawn wet - darker and
; glossier, the sun and the sky in them (rain.sheen, 0 none to 3), the drops seen landing on them as rings spreading where a
; surface faces up and runnels down the sides (rain.drops, 0 none to 3) - and dry off over rain.dry seconds once it stops.
; Needs the scene effects' light (the characters lit per pixel). rain.force=1 is as if it rained, whatever the weather, for
; looking at it; 2 that and the look's parts shown as colours (the rings red, facing up green, the world's yalm lines blue), for
; checking it. Defaults: 1, 1, 1, 45, 0
;rain.wet=1
;rain.sheen=1
;rain.drops=1
;rain.dry=45
;rain.force=0
; The fine ripples over the swell, with or without the pass: how strong (0 none to 3) and how large (0.25 to 4).
; Default: 1, 1
;water.ripples=1
;water.ripple.size=1
; What counts as the water: 0 the flat water tiles found by their shape (Bastok Markets'), 1 the game's own water models (the
; ones a zone's files keep under its water folders: the sea, ponds, rivers, waterfalls), 2 those and the water in the zone's
; own meshes: the flat see-through sheets the game lays over a bed wherever its footsteps say there's deep or shallow water
; (Jugner Forest's ponds, West Ronfaure's streams, Rabao's oasis; the zone's collision is read for it, as Mass Grass reads it).
; A turned or scaled water model is taken like any other. Waterfalls and rivers running downhill stay as the game draws them.
; The log says how many water models each zone has ("Water: zone ..."), and [graphics.effects] debug=11 shows what's found.
; Default: 2
;water.detect=2
; 1 writes every map model the game loads to the log, with the folders above it, and every sheet of the zone's meshes the
; water looked at (its size, place, texture and the floors under it, and whether it was taken), to find water the detection
; misses. Default: 0
;water.log=1

; Texture pack folders, separated by ;. Needs renderer=d3d12 or d3d11.
;textures=textures\fonts

; Writes every texture the game uploads into this folder: <hash>.bin (its first level as uploaded) and
; index.txt (hash, size, format), for making texture pack entries. Slow and large: for one session in one
; area, then remove. Needs renderer=d3d12 or d3d11. Default: off
;tex_debug=textures\dump

; Normal maps: a texture pack folder (textures=) holding <hash>_<w>x<h>.n.dds files (xi tex normals) bends the
; lighting of the matching texture's surfaces, where the sun is lit per pixel ([graphics] light). 0 off, 1 on (a map
; with Y up), 2 shows the bent normal as the colour (to see the map is read), 3 on with Y down. Default: 1
;normalmap=1

; 1 waits for the display at Present (no tearing, a frame more of delay); with renderer=d3d9 from
; the next start. Default: 0
;vsync=1
; V-Sync while the player is in an event, a cutscene (status Event, 4, as while talking to an NPC): 0 off, 1 on; back
; to vsync's when the event ends. 0 with [client] fps.cutscene=0 plays cutscenes as fast as the PC draws while vsync=1
; keeps the rest of the game free of tearing. renderer=d3d12 or d3d11 (d3d9 keeps vsync's); applies while the game
; runs. /vana > Client > Game > Cutscene V-Sync. Default: not set, vsync's.
;vsync.cutscene=0

; Anti-aliasing: fxaa smooths the 3D scene's edges (the interface stays sharp). Needs
; renderer=d3d12 or d3d11; applies while the game runs. Default: off
;antialias=fxaa

; The background resolution: the size the 3D scene is drawn at before it's fitted to the window
; (/vana > Client > Game > Background resolution). A size from 512x512 to 8192x8192 (or one number,
; square). Bigger is sharper and slower: 3072x3072 is about 2.5 times a 2560x1440 screen's pixels for
; every effect. renderer=d3d12 and d3d11 only, and it changes while the game runs; with those the
; launcher's [ffxi] resolution.background is not used. The game's own Direct3D 8 and d3d9 use the
; launcher's. DLSS sets the scene's size while it's on. Default: 3072x3072
;background=3072x3072
; NVIDIA DLSS (renderer=d3d12, an NVIDIA RTX 20 or later; off on GTX cards whatever this says): the 3D scene drawn smaller and made full size again by DLSS,
; which smooths its edges too (antialias and the effects' temporal smoothing give way to it). on draws it at
; dlss.quality (the /vana DLSS panel's switch and slider); dlaa at full size (the sharpest, no faster); quality at
; 67% each way, balanced 58%, performance 50%, ultra 33%.
; background gives way to it. DLSS runs in dlss\VanaCore.Dlss.exe, a 64-bit helper (DLSS has no 32-bit build).
; Changes while the game runs. Default: off
;dlss=quality
; With dlss=on: the /vana DLSS slider, 0 to 100 in steps of 5 - performance at 0, balanced at 35, quality at
; 65, native (DLAA) at 100; the scene drawn at 50%, 58%, 67% and 100% each way, straight between them. Default: 35
;dlss.quality=65
; DLSS frame generation, with DLSS on (an RTX 40 or later): 2x makes a frame between each two the game draws, 3x
; and 4x two and three (an RTX 50). They're shown spaced evenly over the time a frame takes the game, the real
; frame last (a frame's latency). fsr is AMD's frame generation with DLSS instead (2x, any DirectX 12 card: an RTX 20
; or 30 too), as fsr.framegen below. Changes while the game runs. Default: off
;dlss.framegen=2x
; DLSS 5 (neural rendering), with DLSS on: 1 puts the 3D scene through it before DLSS, at the size the scene is
; drawn at (the interface isn't touched). It needs NVIDIA's nvngx_dlssnr.dll, as NVIDIA signed it, beside
; dlss\VanaCore.Dlss.exe (VanaCore doesn't ship it), a card and driver it runs on (an RTX 40 or later), and NVIDIA's NGX to
; give it: the /vana DLSS panel's Resolution line says when it runs, or why not. Its controls are [graphics.effects]
; dlss5_style, dlss5_intensity, dlss5_tone, dlss5_structure, dlss5_skin and dlss5_mask. Changes while the game runs;
; /vana dlss5 on, /vana dlss5 off, or /vana dlss5 alone to switch it, writes and applies it. Default: 0
;dlss5=1
; AMD FSR (renderer=d3d12 or d3d11, any card): DLSS's place for every other card - the 3D scene drawn smaller and made
; full size again by FSR 4 on an AMD Radeon RX 7000 or 9000, FSR 3.1 on any other DirectX 12 card (NVIDIA, Intel and
; older AMD), and FSR 1 (fsr.version) on a card neither runs on.
; on draws it at fsr.quality (the /vana FSR panel's switch and slider); native at full size (FSR as anti-aliasing);
; quality at 67% each way (1.5x), balanced 59% (1.7x), performance 50% (2x), ultra 33% (3x). It runs in
; dlss\VanaCore.Dlss.exe too, with AMD's amd_fidelityfx_loader_dx12.dll and amd_fidelityfx_upscaler_dx12.dll beside it.
; With dlss on as well, DLSS runs on a card it runs on and FSR elsewhere; /vana turns the other off. DLSS 5 is
; DLSS's alone; AMD's frame generation is fsr.framegen below. Under renderer=d3d11 (Windows 10 1703 or later) it
; upscales on textures the game shares with the helper, without frame generation. Changes while the game runs.
; Default: off
;fsr=quality
; With fsr=on: the /vana FSR slider, 0 to 100 in steps of 5 - performance at 0, balanced at 35, quality at 65, native at
; 100; the scene drawn at 50%, 59%, 67% and 100% each way, straight between them. Default: 35
;fsr.quality=65
; FSR's own sharpening of its output (AMD's RCAS), 0 (off) to 1. Changes while the game runs. Default: 0
;fsr.sharpness=0.3
; Which FSR runs: auto (AMD's choice: FSR 4 where it runs, else FSR 3.1), 4 or 3 (that one, where AMD's DLL has it for the
; card; else auto), or 1: FSR 1, VanaCore's own port of AMD's first FSR (an edge-aware upscale, then fsr.sharpness's
; sharpening), run in the game itself on any DirectX 11 or 12 card - no helper, AMD DLLs or Direct3D 11.4. It upscales
; one frame at a time, so it's softer than FSR 3.1 or 4 and has no frame generation; antialias stays on with it. Where
; AMD's FSR can't run (no DirectX 12 for the helper, nothing for the card, the DLLs missing), auto, 4 and 3 use FSR 1
; instead of turning FSR off. Changes while the game runs (FSR made again). Default: auto
;fsr.version=auto
; AMD's frame generation, with FSR on and renderer=d3d12: 2x makes a frame between each two the game draws (FSR FG 4
; on a Radeon RX 9000 under Windows 11, FSR FG 3.1 on any other DirectX 12 card), from the finished frame, the scene
; before the game's interface went over it and FSR's depth and motion, in dlss\VanaCore.Dlss.exe with AMD's
; amd_fidelityfx_framegeneration_dx12.dll beside it; shown as DLSS's are. Changes while the game runs. Default: 2x
;fsr.framegen=off

; What the frame is drawn at, with renderer=d3d12 or d3d11: window draws it at the window's size (sharp at any
; size; in full screen, the screen's), game at [ffxi] resolution.game, stretched to the window (less
; work for the graphics card when that's smaller). Applies while the game runs. Default: game
;resolution=window

[window]
; The window's mode, size and resolution are in [ffxi].
; 1 lets the window's edges be dragged. Default: 0
;resizable=1
; With resizable=1: the size the window's edges were last dragged to (its inside, <width>x<height>), written by the game
; and kept for the next start; the /vana window's Resolution shows it, and an unset [ffxi] resolution.ui (Same as
; Resolution) lays the menus out at that size. The game's own resolution stays [ffxi] resolution.game's. A Resolution
; picked takes it out. Default: none
;lastsize=1600x900
; The mouse scaled to the game's resolution when the window is another size. Default: 1
;mouse.scale=1
; 1: the game draws at the display's own pixels, so a scaled display (125%) doesn't stretch and blur
; it; a window is then its size in real pixels (it looks smaller: pick a larger size). 0: Windows
; scales it. Read when the game starts. Default: 1
;dpiaware=1
; 1 holds off the screen saver, the display's sleep and the lock that follows them while the game runs (as the game's
; own full screen did). 0 leaves them to Windows. Applies while the game runs. Default: 1
;keepawake=0
; 1: closing the window (its X, Alt+F4, the taskbar's Close) with a character in the game runs /shutdown, the game's own
; way out, in place of ending the game with the character still in the world. Closing it again within a minute closes the
; game at once. When the server has been silent for 20 s (disconnected), /shutdown can't work: closing ends the game at
; once. Before login, at the character select, or on a black screen with no character, the game gets the close first; closing
; again 1.5 s or more later, with the game still there, ends it. Closing three times in a row (each within 2 s of the
; one before) ends the game at once, whatever it is doing. The game greys out the X; 1 puts Close back.
; 0: the window closes the game as it did, its X greyed. Applies while the game runs. Default: 1
;close.shutdown=0
; 1 keeps the game window above every other window (else the Windows key, Alt+Tab and the desktop come over it).
; Default: 0
;topmost=1

[ffxi]
; The game's own settings (the ones FINAL FANTASY XI Config sets), by name. VanaCore hands each one
; to the game in place of its registry value (resolution.game is 0001 and 0002, mipmap is 0000, ...);
; no registry is ever read or written. One that isn't set here or in [ffxi.registry] gets its
; default below, a new account's in the CatsEyeXI launcher; one without a default, or set to -1,
; keeps the game's own. A number outside what a setting is known to take is logged, and still handed
; to the game. Read when the game starts, except mode and resolution.game's window size. The log
; shows each setting the game reads (Game setting 0001 = 1920 ([ffxi] resolution.game)).

; Which wins where this section and [ffxi.registry] both set a value: 0 this section's, 1
; [ffxi.registry]'s (for mode too, against its 0034). Default: 0
;registry.override=0

; The game window's mode, FFXI's four: fullscreen, windowed, borderless (borderless windowed) or
; borderless fullscreen; 0-3 work too, in that order. Changes while the game runs (full screen with
; renderer=d3d8 at the next start). With renderer=d3d12 or d3d11, fullscreen is borderless fullscreen.
; Default: borderless fullscreen
;mode=borderless fullscreen

; The game's resolution, which it lays the screen out in, and in windowed and borderless the window's
; size, which changes while the game runs (the game's own at the next start). In full screen the
; window is the screen; with renderer=d3d12 or d3d11 and [graphics] resolution=game the frame is drawn
; at this size, which changes while the game runs too, and stretched over the screen (1280x720 on a 4K
; screen: drawn at 1280x720); with renderer=d3d8 it's then the screen's resolution. auto is the
; resolution Windows has the display at (worked out at each start), auto-75 three quarters of it each
; way (auto-<percent>, 1-100), auto-50 half, auto-taskbar the display less the taskbar (windowed: the
; window, title bar and all, fills that). The CatsEyeXI launcher leaves an auto one alone.
; Default: auto (the window's size is the resolution of the display it's on; the game starts at the main one's)
;resolution.game=1920x1080
; The interface's resolution: menus and text are drawn at this size, then scaled to the window, so
; smaller makes the interface bigger. Usually resolution.game or less. Takes auto and auto-<percent>
; too (shares of the screen), and window and window-<percent> (window-75): that share of the game's
; window, which is resolution.game's size, the window's inside in the windowed modes with its title bar
; and borders left out. A window one follows the window while the game runs (made again when
; resolution.game or [ui] aspect changes) and takes [ui] aspect's shape when that keeps the interface
; to a shape, so the aspect works in any window. Changes while the game runs: the open windows keep to
; their edges. Default: resolution.game
;resolution.ui=1920x1080
; The 3D world's resolution (the background resolution): the game draws the world at this size,
; then scales it to the window. Larger than the window is sharper and slower; 4096x4096 is the
; largest known to work. Even numbers work best. [graphics] background sets it in its place
; (renderer=d3d12 and d3d11).
; Default: 2048x2048
;resolution.background=4096x4096

; Mip mapping: 0 off, 1 lowest quality ... 6 best quality. Default: 6
;mipmap=6
; Environment animations: 0 off, 1 normal, 2 smooth. Default: 2
;env_anim_mode=2
