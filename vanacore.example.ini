; Copy next to VanaCore.exe as vanacore.ini. Every key is optional.
; Relative paths are from VanaCore.exe's folder.

[client]
; 1 starts the retail game as Windower does, with no login, [server] or bootloader of VanaCore's: VanaCore.exe finds PlayOnline in
; the registry (HKLM\SOFTWARE\PlayOnline[US|EU]\InstallFolder), starts its pol.exe with VanaCore loaded, and PlayOnline's own login
; and Play button take it from there. PlayOnline asks for administrator rights (Windows asks, for VanaCore). The game keeps its
; real registry keys and folders; [ffxi] and [ffxi.registry] serve only the settings they name. Default: 0
; VanaCore.exe --retail does the same for one start.
;retail=1
; Which install, jp, us or eu. Default: the first the registry has, US then EU then JP
;retail.region=us
; pol.exe's arguments. Default: /game eAZcFcB (turns on FFXI's quick start button, as Windower does)
;retail.args=/game eAZcFcB
; 1 adds " - VanaCore v<version>" to PlayOnline's window titles ("PlayOnline Viewer Ver.1.18.15e - VanaCore v0.8.147"), so a
; window says VanaCore is in it. 0 leaves them as they are. Default: 1
;retail.title=0
; PlayOnline's folder (the one with pol.exe), in place of the registry's. Not pol=, which is the CatsEyeXI client's and stays
; as it is: retail ignores pol= and ffxi=
;retail.pol=D:\Final Fantasy XI\SquareEnix\PlayOnlineViewer
; A bootloader (xiloader) to log in and start the game, in place of VanaCore's own login. Default:
; none: VanaCore logs in to [server] itself and starts the game.
;bootloader=pol.exe
; 0: VanaCore exits once the game is up. 1: VanaCore stays with the game, shows its log live,
; and closing VanaCore closes the game. Default: 0
;attached=1
; 1 titles the window "VanaCore v<version>" until a character is in the world. Default 0: "FINAL FANTASY XI", the game's own,
; which window switchers (XI Focus) read again once the name is there; the name is the title in the world either way.
;title.vanacore=1

; 1 closes VanaCore's window when the game exits normally, instead of waiting for a key. After
; an error or a crash it still waits, so the message stays readable. Default: 0
;autoclose=1

; The game works from a copy of its settings file, made when it starts (%TEMP%\VanaCore\vanacore.<pid>.ini), so a change
; made to the file while the game runs (the launcher, a hand edit, another client) isn't taken up. What the game writes
; (the /vana window) goes to the file as well, that key only. 1 takes the file's changes up as they happen (looked at once
; a second). /vana > Client > Developer > Reload settings takes the file up once. Default: 0
;
; The settings file is this one, or the one VanaCore.exe is given with --ini: the CatsEyeXI launcher gives each account
; its own, vanacore.<hash>.ini beside this file (12 hex digits of a hash of the username, never the username itself),
; made from the account's profile. Every key there is optional too: what it hasn't is VanaCore's default.
;ini.upstream=1

; 1 turns DEP on for good as the game starts. For Wine on a Mac (CrossOver): without it the logos and the agreement screen
; can run at 1-2 FPS for the first minutes. Nothing changes on Windows. On a Steam Deck (Proton) it stopped PlayOnline
; from starting. Default: 0
;dep=1

; 1 saves everything the chat log shows to logs\chatlog.<character name>.<yyyy-mm-dd>.log, a new file
; each day. Applies while the game runs. Default: 0
;chatlog=1

; 1 puts [Say], [Shout], [Yell], [Tell], [Party], [Linkshell], [Unity] and the like in front of those messages (also in
; the saved chat log). Not on the game's own system lines. A linkshell line loses the game's own [1]/[2]: [Linkshell 2] <Name>
; text, not [Linkshell 2] [2]<Name> text. Applies while the game runs. Default: 0
;chat.prefix=1
; 1 uses short names: [S], [Sh], [Y], [T], [P], [LS], [LS 2], [Em], [U], [A]. Default: 0
;chat.prefix.short=1
; How opaque the interface's window backgrounds are (chat, menus, help bars), in percent of how the game draws them,
; and the chat windows' own (window.opacity doesn't apply to them). The game's own: 100. Applies while the game runs.
;window.opacity=70
;chat.opacity=50
; The same for the windows' frames (their border pieces): all of them, and the chat windows' own. 100 by default.
;window.border.opacity=50
;chat.border.opacity=30
; The windows' background colour, #RRGGBB: every window's, and the chat windows' over it. The game's own (a dark blue with a
; pattern) if not set. The backgrounds are then drawn flat in that colour, shaded top to bottom as the game does.
;window.color=#000000
;chat.color=#0A1030
; A picture drawn in place of the windows' background (over window.color), with their opacity: a .png, .jpg, .bmp or .gif,
; its path from VanaCore's folder unless it's a whole one (/vana's Browse copies it into images\ and sets that). The chat
; windows take it with chat.match=1, the chat input with input.match=windows. Not set: the game's background.
; window.image.fit: fill (covers each window, cropped to its shape; the default), stretch, tile (repeated at its own
; pixels) or screen (one picture over the whole screen, each window showing the part behind it).
;window.image=images\backdrop.png
;window.image.fit=fill
; The windows' frame colour, #RRGGBB, the same way (window.border.color for every window, chat.border.color for the chat's):
; the frame's shape in one flat colour. The game's own if not set.
;window.border.color=#FFFFFF
;chat.border.color=#7AA2F7
; 1 draws the frames as a plain line along the windows' edges in the colour above (the game's grey if none), the frame's
; pattern left out: every window's, the chat windows', the chat input's (input.border.solid). Default: 0
;window.border.solid=1
;chat.border.solid=1
; The windows' corners (/vana > Game Options > Windows > Corners): square (the game's), cut (a straight line across each
; corner) or round, window.corners.size of the interface's pixels from each corner (1 to 32; at most half a window's
; height, so a short one comes out as a pill). Every window's, the chat windows' and the chat line's, on those whose frame
; is a solid line (window.border.solid, chat.border.solid, input.border.solid) or not drawn (its border opacity 0): the
; game's own frame has its corners in its picture. The background and the line are smoothed along the corners. Applies
; while the game runs. Default: square, 6
;window.corners=round
;window.corners.size=6
; 1 hides the title on top of the menus: "Commands" over the main menu, the Magic, Abilities, Party, Linkshell, Search and
; Config menus', and "Status" over the Status window, "Network" and the party list's (/vana > Game Options > Windows >
; Hide menu titles). Applies while the game runs. Default: 0
;titles.hide=1
; The menus' buttons' colour, #RRGGBB, and the selected button's (/vana > Game Options > Buttons > Global > Colour): every
; menu's button bars in that colour, as they'd look on the frame (with action.solid or mainmenu.solid, the same as they
; are); their labels stay the game's. The game's own if not set (a bar on the frame is about #4B65A0, the selected one
; #4B4845, its label gold). Dark colours fade on the frame, which the bar is added onto. Applies while the game runs.
;buttons.color=#4B65A0
;buttons.selected.color=#4B4845
; The buttons' look (/vana > Game Options > Buttons > Global). game is the game's glossy bar; flat draws each button as a
; plain box instead, filled with buttons.color (buttons.selected.color for the selected one; empty, the game's colours
; above) at buttons.opacity (0 to 100: 0 leaves only the border and the label), inside a border buttons.border.size
; pixels thick (0 to 4, 0 none) in buttons.border (buttons.selected.border for the selected one, else the same). The box
; reaches buttons.padding.x (-16 to 16) and buttons.padding.y (-8 to 8) pixels past the button's own size on each side;
; less than 0 is smaller, which leaves gaps between the buttons. A flat button still flashes when picked. Default: game
;buttons.style=flat
;buttons.opacity=100
;buttons.border=#8A8FA6
;buttons.selected.border=#D8B060
;buttons.border.size=1
;buttons.padding.x=0
;buttons.padding.y=-1
; With buttons.style=flat, this many pixels (0 to 16) between each row of a menu's buttons, the menu made taller to fit
; where it stands (the Action Menu and the lists over the chat grow up, their bottoms kept); the frame's glossy slots for
; the buttons are left out. The menus that are up take a change at once. Not an NPC's questions. Default: 0, the game's
; (touching)
;buttons.spacing=4
; With buttons.style=flat, the labels moved this many pixels right (buttons.text.x, -16 to 16) and down (buttons.text.y,
; -8 to 8); less than 0 is left and up. Default: 0
;buttons.text.x=0
;buttons.text.y=1
; The buttons' labels' colour, #RRGGBB, and the selected button's, whatever the style. The game's white and gold
; (#FFA040) if not set; their shadow stays the game's.
;buttons.text=#FFFFFF
;buttons.selected.text=#FFA040
; 0 keeps the selected button where it's laid out: the game draws it a pixel up and left of the others, and presses it a
; pixel down and right while it flashes. Default: 1
;buttons.selected.nudge=0
; 0 leaves out the flash when a button is picked (the label and bar growing and fading). Default: 1
;buttons.selected.flash=0
; The main menu's buttons (Status ... Log Out) and the menus it opens in its place (Magic, Party, Search, Linkshell, Config,
; the Map..., and the lists those open in theirs, Config's Windows and Log: the windows mainmenu.font covers) have every
; buttons.* key above as their own, mainmenu.buttons.<key>
; (/vana > Game Options > Buttons > Main Menu), and the Action Menu's (Attack, Magic, ...: Monstrosity's too, and the Magic
; and Abilities lists it opens beside it) action.buttons.<key> (Buttons > Action Menu). Each is the buttons.* one's (Buttons
; > Global) until it's set. Applies while the game runs.
;mainmenu.buttons.style=flat
;mainmenu.buttons.color=#30406A
;mainmenu.buttons.spacing=2
;mainmenu.buttons.selected.nudge=0
;action.buttons.style=flat
;action.buttons.padding.y=-1
; The Config windows' sliders (Window Settings' lines and width, the volumes, ...): game, the game's bars with a half dot
; at each end; flat, VanaCore's own, a plain bar sliders.height thick (1 to 16) in sliders.track.color at
; sliders.track.opacity (0 to 100), filled up to the value in sliders.fill.color (sliders.selected.color for the one the
; cursor is on; empty, the fill's), its ends rounded unless sliders.round=0. The game still moves the value: its mouse
; and keys are as they were. Default: game
;sliders.style=flat
;sliders.height=4
;sliders.round=1
;sliders.track.color=#3A4266
;sliders.track.opacity=100
;sliders.fill.color=#8C9EFF
;sliders.selected.color=#FFA040
; With sliders.style=flat, the knob at the value: none, round, square or bar (a line across), sliders.knob.size (2 to 24)
; in sliders.knob.color. Default: round
;sliders.knob=round
;sliders.knob.size=10
;sliders.knob.color=#FFFFFF
; With sliders.style=flat, the marks at each end of the bar, where the game's half dots are: none, game (the game's own),
; round, square or bar, sliders.ends.size (2 to 16) in sliders.ends.color. Default: none
;sliders.ends=none
;sliders.ends.size=6
;sliders.ends.color=#8A8FA6
; 1 gives the chat windows the Windows values above (opacities and colours), whatever chat.* say. Default: 0
;chat.match=1
; The chat input line (the window Enter opens): windows looks like every window (the values above), chat like the chat
; windows, off by its own input.* below (the same as chat.*). Default: windows
;input.match=off
;input.opacity=60
;input.border.opacity=60
;input.color=#0A1030
;input.border.color=#7AA2F7
;input.border.solid=1
; 1 hides the tab over the chat input that names where the line goes (Say, Shout, Linkshell 2 and its name). Default: 0
;input.hidetab=1
; 1 leaves off the hanging indent the game gives the second line of some wrapped messages (linkshell, system). New lines only.
; Applies while the game runs. Default: 0
;chat.noindent=1
; Logs the chat mode (the game's number for the kind of message) of each line to vanacore.log, to check which numbers
; chat.prefix names. Default: 0
;chat.modes.debug=1

; 1 puts [HH:MM:SS] in front of each line the chat log shows. Applies while the game runs. Default: 0
;chat.timestamps=1
; square: [20:34:05] text   round: (20:34:05) text   none: 20:34:05 - text. Default: square
;chat.timestamps.style=square
; 0 leaves the seconds out. Default: 1
;chat.timestamps.seconds=0
; 1 shows 8:34pm instead of 20:34. Default: 0
;chat.timestamps.hour12=1
; With the 12-hour clock: lower is 8:34pm, upper is 8:34PM; lower_spaced and upper_spaced put a space before it (8:34 PM).
; Default: lower
;chat.timestamps.ampm=upper
; 0 leaves the time off the game's system, NPC and server lines (the ones it indents), keeping it to chat. Default: 1
;chat.timestamps.system=0
; The time's colour, #RRGGBB. Not set: the colour of the line it's in (the game's own). Default: not set
;chat.timestamps.color=#80C0FF

; The space between the chat window's rows, in pixels, 8-64. The game's is 16. The window itself stays the same size,
; so taller rows show fewer lines. Applies while the game runs. Default: 16
;chat.lineheight=20

; How many lines you have sent that Up and Down bring back in the chat line, 9-100. The game keeps 9. An empty line, or the
; same as the one before it, isn't kept. Applies while the game runs; the lines are lost when the game closes. Default: 20
;chat.history=50
; How many lines the chat window scrolls back through, 100-12500, since the game started. The game saves its lines to disk as
; it goes (TEMP\1_0.<process>.log..., 50 to a page) and keeps 20 pages, 1,000 lines a window; VanaCore has it keep as many
; pages as this asks for (up to 250). Without this the log scrolled back only as far as the rows the window holds (about 50
; after the log has been opened and closed). Every log tab scrolls back through its own lines (the game's only on the
; Window tabs). 0 leaves the game's own scrolling. Applies while the game runs (more pages from the next one written).
; Default: 12500
;chat.scrollback=5000

; A dark edge behind the chat's text, so it reads over bright scenery with a see-through chat background (the game adds its
; text's colour to what's behind it, with no edge of its own): 1 a shadow a pixel down and to the right, 2 an outline all
; round, 0 none. chat.shadow.opacity is how dark, in percent. The game font's only: with chat.font=sharp, chat.font.outline
; (else truefont.outline) is the letters' outline. Applies while the game runs. Default: 0, 80
;chat.shadow=1
;chat.shadow.opacity=80

; True Font (/vana > True Font): the interface's letters drawn from a TrueType font at the screen's own size, so they stay
; crisp at any resolution.ui, instead of the game's own 16-pixel letters made larger with the interface. The default font
; first: truefont.family (one installed in Windows or in VanaCore's fonts folder, where /vana's Custom Fonts copies a .ttf
; or .otf), truefont.outline (a black outline that many of the interface's pixels wide round the letters, 0-4, 0 none) and
; truefont.outline.opacity (percent). Default: Segoe UI, 0, 100
; truefont.disable=1 (/vana > True Font > Disable True Font) turns every area below off at once, each area's own settings
; kept. Not the nameplates or damage numbers ([graphics] nameplates.font, damage.font): they keep their own. Default: 0
;truefont.disable=1
; truefont.gdi=1 (/vana > True Font > Draw all text with GDI) draws every True Font letter with Windows' GDI, none with
; DirectWrite, as the fonts in VanaCore's fonts folder always are: the same picture for a font installed in Windows. Letters
; sit on whole pixels (their spacing a little uneven at small sizes). Default: 0
;truefont.gdi=1
;truefont.family=Segoe UI
;truefont.outline=1
;truefont.outline.opacity=100
; truefont.japanese: the font of the full-width letters (kana, kanji, full-width signs) in every area, each drawn no larger
; than the game's full cell and laid where the game lays it. Empty: each area's own font (Windows' Japanese font where it
; has none). Default: empty
;truefont.japanese=Yu Gothic UI

; Then each area: <area>=sharp (True Font) or game, <area>.family (a font of its own; none: the default font),
; <area>.size (its size in the interface's pixels, 6-48), <area>.bold and <area>.italic (1 or 0), <area>.uppercase (1:
; its letters in capitals, the words laid as wide as the capitals make them; tips.font.uppercase every tooltip part's until
; the part's own is set), <area>.outline and
; <area>.outline.opacity (its own outline, as truefont.outline's; none: the default font's). The areas: chat.font, the
; chat windows' rows (16 by default; the
; rows are 16 apart), laid out and wrapped by the font's own spacing, with chat.font.spacing that many of the interface's
; pixels more between letters (-4 to 8, below 0 closer); menu.font, the menus and lists (15); lists.font, Menu Lists: the
; Merit Points menu's lists, their categories, merits and points box (15; each key menu.font's until it's set; their buttons
; stay mainmenu.font's); items.font, the item lists
; (Items and its bags, storage, Equipment, the bank, trades, deliveries, shops, the auction house: 15); tips.font, an item's
; details (15; tips.font.lineheight: its lines that many pixels apart, 12-32, 16 the game's; tips.font.padding.top: its
; text that many pixels lower, 0-48; tips.font.padding.bottom: that much more room below the last line, 0-48;
; tips.font.opacity: all its text that opaque, 0-100, 100 the game's, 0 hidden;
; tips.font.<part>.size, .color and .space for each part of it, found by its text: title, the item's name; type, the line
; after it starting [ or ( ("[Body]All Races"); stats, the stats and description; jobs, the line starting Lv. and the job
; names after it; signature, the last line when it's a name in brackets ("[Voltiz]", its crafter's); timer, a line in
; angle brackets ("<1/1 0:30/[20:00:00, 0:30]>", its numbers the timer's colour unless its own .numbers.color). .size: its letters at
; this size, 6-48, none the rows' size; .color: #RRGGBB, none the game's; .space: that many pixels above it, 0-48 (not the
; title's); .opacity: 0-100, times tips.font.opacity; .numbers.color: its numbers (with the + or - before one and the %
; after) in this colour, #RRGGBB, none the part's; .bold, .italic (0 or 1, none tips.font's) and .outline (0-4 pixels,
; none tips.font's): its own; .uppercase=1: its letters in capitals, spaced as the game spaces capitals. Its box made
; taller and wider to hold them, to the pixel; /vana Game Options >
; Item Tooltips); help.font, spell details and the help bar (15); input.font, the chat input line and its Say /
; Shout / Linkshell tab (15; /vana Game Options > Chat); phrases.font, the auto-translate list Tab opens while
; typing (15; its count stays the game's; /vana Game Options > Chat); buttons.font, the labels on the menus' buttons ("Status",
; "Equipment": 11); titles.font, the menus' other labels, the windows' titles (each titles.font key buttons.font's until it's
; set); mainmenu.font, the main menu's commands (Status ... Log Out) and the menus they open in its place (Config, Magic,
; Party, Search, Linkshell, Macros, Communication...) apart from every other menu's buttons (each of its keys
; buttons.font's until it's set; with mainmenu.buttons=1 its own keys alone, its switch, mainmenu.font itself, buttons.font's
; while unset; /vana Game Options > Buttons > Main Menu); action.font, the Action Menu's commands (Attack,
; Magic...) and its Magic and Abilities lists, the same way (Buttons > Action Menu); and
; status.font, the Status window's numbers and words (11); clock.font, the clock under the
; compass (11, its own keys alone); trade.font, every letter in a trade's window and the delivery box (11, its own keys
; alone); gil.font, the Current Gil box wherever it shows (11, its own keys alone); profile.font, every letter in the Status
; screen's Profile panel, its labels and values (11, its own keys alone; /vana Game Options > Status Window), and
; profile.title.font its two titles, Profile and Monstrosity, and Job Levels' and the Skills windows' (profile.font's keys
; until set); equip.font, the Equipment window's slot
; names (Main, Sub, Range...; under an item they stay under its picture; hide leaves them out), and equip.stats.font, its
; element numbers, Attack and Defense and the stats under it (11 each, their own keys alone; /vana Game Options >
; Equipment); macrobar.font, the macro bar's key labels, Ctrl or Alt and the number under each
; macro (11, its own keys alone; macrobar.font.color=#RRGGBB colours them, unset the game's colour; /vana Game Options >
; Macro Bar, not the True Font page: Key Font); macrobar.name.font, the macros' names under the keys
; (15; each key menu.font's until it's set, as they were; Macro Bar > Name Font); buffs.font, the status icons' timers
; (13: the game draws them smaller; each centred under its icon as the game centres it; /vana Game Options > True Font and
; Game Options > Status Icons); target.font, the Target window's name (11; each key status.font's until it's set), and
; target.title.font, its "Target" title (each key titles.font's until it's set, and those buttons.font's; the lock-on
; picture's "Locked" stays titles.font's; /vana HUD > Target Window and Game Options > Target);
; party.font, the party list's names and numbers, and alliance.font, the alliance lists'
; (each of their keys status.font's until it's set; on /vana Game Options > Party / Alliance). The menus', the
; item lists', the help's, the chat input's, the auto-translate list's and the Status area's text is laid a word at a time: each word starts where the
; game's does, its letters in the font's own spacing (the Status area's words end where the game's do too, the party and
; alliance lists' as well); a tooltip's letters are each centred in the space the game gives them. items.font, tips.font,
; help.font, input.font, phrases.font, buffs.font, buttons.font and status.font are
; menu.font's (game or sharp) until they're set. Only
; ASCII, and only text in the game's own sizes. Applies while the game runs. Default: game
; truefont.debug=1 writes True Font's steps to the log every 300 frames (what it found of the game's, the draws it saw and
; kept, the interface's target and whether it was seen laid onto the screen), for a True Font that does nothing.
;chat.font=sharp
;chat.font.size=16
;chat.font.spacing=0.5
;menu.font=sharp
;menu.font.size=15
;items.font.family=Segoe UI Semibold
;help.font.size=14
;tips.font.lineheight=19
;tips.font.padding.top=4
;tips.font.title.size=18
;tips.font.jobs.color=#C0C8FF
;tips.font.stats.numbers.color=#FFE080
;tips.font.signature.color=#C0A0FF
;tips.font.title.uppercase=1
;tips.font.type.opacity=0
;tips.font.timer.color=#FFC080
; tips.icon.x, .y (-128 to 128, the interface's pixels) and .size (25-400, percent, 100 the game's): an item's details'
; picture, with a stack's count over it, moved and made larger round its middle; tips.badges.x, .y, .size the same for its
; Rare and Ex badges (which also move right as far as True Font widens the box). Where the game draws them, so with the
; game's letters too. Default: 0, 0, 100
;tips.icon.size=125
;tips.badges.x=-4
;tips.font.jobs.space=4
;help.font.italic=1
;buttons.font.bold=1
;buttons.font.size=11
;titles.font.size=14
;mainmenu.font.size=20
; mainmenu.font.fixed: a main menu label the game squeezes to fit its button ("Communication", Macros' "Edit Equip. Set") in
; True Font at the font's full size, running past its button as a long label in a larger font does; 0 its letters narrowed as
; the game narrows them, to 85% of the font's width at most (/vana Game Options > Buttons > Main Menu > Long labels full
; size). Default: 1
;mainmenu.font.fixed=0
;status.font=game
;clock.font.size=13
;trade.font.size=14
;gil.font.size=12
;equip.font=hide
;equip.stats.font.size=14
;macrobar.font.size=13
;macrobar.name.font=sharp
;macrobar.name.font.family=Segoe UI
;macrobar.name.font.size=12
;buffs.font.size=12
;target.font.size=16
;target.title.font.size=13
; The tabs over the chat log when it's open to scroll (Window, Say, Tell, Party, Linkshell...): chattabs.font=sharp (each
; key titles.font's until it's set) writes each tab's whole name in its tab in that font, cut where the next tab covers it,
; in place of the game's letters. chat.tabs.names=short (LS2, PT, AJ) or full (the default); chat.tabs.align=centre or left
; (the default); chat.tabs.x and .y move the names (-16 to 16); chat.tabs.color and chat.tabs.selected.color (#RRGGBB,
; white); chat.tabs.spacing how far apart the tabs not picked are (16 to 64; the game's 30), with the game's letters too;
; chat.tabs.hide=1 no tabs at all. With the names True Font's: chat.tabs.background=game (the game's picture, tinted by
; chat.tabs.tint and .selected.tint, white as it is), flat (boxes in chat.tabs.background.color and
; .background.selected.color, #2A2E45 and #C87A2A) or none; chat.tabs.background.opacity (0 to 100); chat.tabs.height (8 to
; 32, the game's 12, taller upward); chat.tabs.width=fit (each tab as wide as its name, chat.tabs.gap apart, 0 to 16) or game;
; chat.tabs.padding (0 to 16, 4: a name from its tab's left).
; /vana Game Options > Chat > Chat tabs
;chattabs.font=sharp
;chattabs.font.size=12
;chat.tabs.names=short
;chat.tabs.spacing=40
;chat.tabs.background=flat
;chat.tabs.width=fit
;chat.tabs.height=14

; 1 moves the chat window: chat.x is its left edge and chat.y its bottom edge (it grows upward from there), chat.width
; its width, each a percent of the screen. Applies while the game runs; 0 puts it back where the game has it. While
; fancychat stands in for the chat (loaded, its Show with legacy chat off), the chat windows stay where the game has them
; (moved up, fancychat takes them for opened and hides its own). Default: 0
;chat.move=1
;chat.x=25
;chat.y=60
;chat.width=50
