; 1 puts those stats in a box of their own, framed as the game's windows are and drawn while the Equipment window is
; open, its left edge at equip.stats.x and its top at equip.stats.y (percents of the screen's interface), as wide as the
; Equipment window or wider for the longest stat and its number. The Equipment window keeps the game's height then (its
; Attack and Defense row still taken out: the box has them). /vana's HUD Manager > Equipment Stats moves it (Shift +
; drag its box: that turns this on). 0 keeps them under the Equipment window. Default: 0
;equip.stats.move=1
;equip.stats.x=26
;equip.stats.y=11
; 1 puts the /check stats (equip.stats.check) in a box of their own the same way, drawn while the Check window is open,
; its left edge at equip.stats.check.x and its top at equip.stats.check.y. /vana's HUD Manager > Check Window Stats moves
; it (Shift + drag its box: that turns this on). 0 keeps them under the Check window. Default: 0
;equip.stats.check.move=1
;equip.stats.check.x=11
;equip.stats.check.y=3

; 1 adds VanaCore to the end of the game's own Config list (the main menu's Config), drawn as the game's own items are,
; with its own help line. Choosing it opens the /vana window, as typing /vana does. HUD (/hud), FPS Graph
; (/vana graph) and Game Stats (/vana stats) come after it, then addons' items. 0 leaves the game's list as it is.
; Applies while the game runs (once the Config list is closed). Default: 1
;configmenu=0

; 1 adds VanaCore's rows to the game's own Config > Gameplay window, under Music Volume (the rows under it move down):
; World Sounds Volume (sound.world, the world's and battle's sounds) and Interface Sounds Volume (sound.interface, the
; menus' cursor, select and cancel sounds), 0 to 100 each, a share of the game's Sound Effects Volume. Sliders like the
; game's, saved when let go; the shares apply only while this is on. English menus only. /vana > HUD > Main Menu: Config
; > Enable extended game settings. Applies while the game runs (once the window is closed). Default: 0
;gamesettings.extended=1
;sound.world=100
;sound.interface=100

; 1 makes the main menu one list: its second page (Missions ... Log Out) under the first (Status ... Map), with no
; flipping between them on Left / Right or the menu key (which closes it). Applies once the main menu is closed.
; Default: 0
;singlemenu=1

; 1 puts Equip at the top of the box an equip set opens (Macros > Edit Equip. Set: Edit, Change Name, Copy, Paste,
; Delete, Use Current, Equip, Style Lock), with the cursor starting on it; each button does what it did. Applies the next
; time the box opens (/vana HUD > Main Menu: Macro Options > Equip first). Default: 0
;macrooptions.equipfirst=1

; 1: extended macro book names. A macro book's and an equip set's name (Macros > a book or a set > Change Name) takes
; spaces and symbols, not only letters and digits (any typed character; a book's name is kept as typed in mcr.ttl /
; mcr_2.ttl), and their lists give a name the row's whole width, 96 pixels where the game stops at 75. A name is still 15
; characters at most: the game keeps 16 bytes for each. The macro menus' own font has only letters and digits: with True
; Font on for menus the whole name shows, with it off a space or a symbol is kept but not drawn in the lists. Applies the
; next time the name box or the list opens (/vana Game Options > Macro Bar > Enable extended macro book names).
; Default: 0
;macronames.extended=1

; 1: when you zone in, the zone's name shows in the middle of the screen, fades in, stays a moment and fades away (/vana Game
; Mods > Zones > Zone Name). It waits for the zone to load; going into your Mog House shows nothing, leaving it does. Default: 1
;zonename=0
; 1: the name shows when you log in too. Default: 1
;zonename.login=0
; How big the letters are, in pixels at the interface's size (6 to 128), where the middle of the name sits, as a
; percent of the screen across from the left and down from the top (0 to 100), and the seconds it stays at full strength between
; its fade in (0.6 s) and fade out (1.6 s) (0.5 to 15). They're read when the name starts: a change shows from the next zone.
; Default: 60, 50, 40, 3
;zonename.fontsize=60
;zonename.x=50
;zonename.y=40
;zonename.seconds=3
; How the name comes and goes: fade, scale (it grows from half its size and shrinks away), slide (it comes in from the side
; zonename.slide names, left, right, top or bottom, and leaves toward the one zonename.slide.to names: those, or opposite, the
; side across), wave_io (a ripple runs through the whole name as it comes and goes, and it is still while it stays) or wave (the
; ripple carries on, gently, while it stays) or dissolve (the letters are eaten away in a noise, with a burning edge). A wave or a
; dissolve needs VanaCore.Core.dll of 13 November 2026 or later, else it fades.
; Default: fade, left, opposite
;zonename.animation=fade
;zonename.slide=left
;zonename.slide.to=opposite
; How fast a wave's ripple runs along the name, as a multiple of the usual (0.1 to 5). Default: 1
;zonename.wavespeed=1
; With dissolve, 1 lights its front: the letters about to go glow in an edge colour (#RRGGBB), white-hot at the very front.
; Default: 1, #FF7A1A
;zonename.dissolve.burn=1
;zonename.dissolve.color=#FF7A1A
; The name's look: the font (a family Windows has, or one in fonts\), italic, bold (1 or 0), the outline's thickness (0 to 3) and
; colour, the letters' colour, and with the gradient on (1) the colour they end on: each letter shades from the first colour to
; the second, left to right. Default: Georgia, 0, 1, 1, #000000, #FFFFFF, 0, #FFC850
;zonename.family=Georgia
;zonename.italic=0
;zonename.bold=1
; 1: the name in capitals. Default: 0
;zonename.uppercase=0
;zonename.outline=1
;zonename.outline.color=#000000
;zonename.color=#FFFFFF
;zonename.gradient=0
;zonename.color2=#FFC850
; Which way the gradient runs: horizontal (left to right: each letter its own colour) or vertical (top to bottom: the first
; colour at the top of the letters, the second at their bottom). Default: horizontal
;zonename.gradient.direction=horizontal

; 1: the region the zone is in (Ronfaure, Zulkheim, ...) shows above the zone's name, with the same animation, seconds and login
; setting (/vana Mods > Zones > Region Name). A zone in no region shows none. It is switched on and looks apart from the
; zone's name: zonename.region.* are zonename.* for the region's line, each its own (the zone's is above). Default: 0
;zonename.region=1
; The region's letters: size (6 to 128), where the middle of its name sits (X, Y: percent of the screen, 0 to 100), the font,
; italic, bold, capitals (1 or 0), the outline's thickness (0 to 3) and colour, the letters' colour, and with the gradient on (1)
; the colour they end on.
; Default: 32, 50, 31, Georgia, 0, 0, 0, 1, #000000, #FFD98A, 0, #FFFFFF
;zonename.region.fontsize=32
;zonename.region.x=50
;zonename.region.y=31
;zonename.region.family=Georgia
;zonename.region.italic=0
;zonename.region.bold=0
;zonename.region.uppercase=0
;zonename.region.outline=1
;zonename.region.outline.color=#000000
;zonename.region.color=#FFD98A
;zonename.region.gradient=0
;zonename.region.color2=#FFFFFF
; The same, for the region's gradient: horizontal or vertical. Default: horizontal
;zonename.region.gradient.direction=horizontal

; 1: the main menu's Party > Find Member opens the Party Finder addon's window when the addon is loaded, in place of the
; game's search for characters seeking a party (the game's search without it). 0 keeps the game's search. Default: 0
;partyfinder.findmember=1

; The PlayOnline and FFXI folders the game runs from. Without them, the PlayOnline install Windows
; knows about is used.
;pol=C:\Program Files (x86)\PlayOnline\SquareEnix\PlayOnlineViewer
;ffxi=C:\Program Files (x86)\PlayOnline\SquareEnix\FINAL FANTASY XI
; The frame rate the game renders at, 1-60; 0 unlocks it (the game's divisor 0: as fast as the PC draws, or the
; screen's refresh rate with vsync; above 60 the game's animations, effects and interface run fast). Default: 60.
; VanaCore holds the rate with its own timer, in place of the game's own uneven wait.
; This key, the fps.display and fps.position keys and the font keys below apply while the game runs: save the file
; and the change shows within half a second.
fps.max=60
; The frame rate while the player is in an event, a cutscene (the player's status is Event, 4, as it also is while
; talking to an NPC), 1-60, or 0 unlocked (the game's animations run fast above 60 FPS, so a cutscene plays faster).
; Back to fps.max when the event ends. /vana > Client > Game > Cutscene FPS, /vana fps cutscene <1-60|uncapped|off>.
; Applies while the game runs. Default: not set, fps.max's.
;fps.cutscene=0
; The most frames per second while the game is in the background (another program's window in front),
; 1-60. /vana > Client > Game > Background FPS: Same as Max FPS (0) or Reduced FPS (30). Default: 0, fps.max's.
;fps.background=30
; 1 asks Windows for a 1 ms timer for the game (its sleeps otherwise last 15.6 ms steps, which
; makes the frame rate uneven). Default: 0, Windows' own.
;timer.resolution=1
; Frame pacing, at 60 FPS (the game counts each frame as a whole number of 60ths of a second, 1 from 60 FPS down to
; 30, so between them what it times by frames runs slow): the characters' motion and the actions' timing (a weapon
; skill, spell or ability plays its motions, hits and effects each at its step) kept to the clock together; the
; interface and the chat (.ui: their updates run again for a long frame, the chat's scrolling kept up); the camera
; against a wall (.camera: two steps a frame, so it doesn't flicker). What the FrameFix plugin did (it isn't loaded
; while any is on), and the actions besides. /vana > Client > Game > Frame pacing. Changes while the game runs.
; Default: 1, 1, 1
;framepacing=0
;framepacing.ui=0
;framepacing.camera=0
; 1 keeps a walk on auto-run (walk mode, then the auto-run key) the walk motion below 60 FPS: the game judges it by
; whole 60ths a frame, so at 30-59 FPS it can play the run motion slowly. /vana > Client > Game > Fix Auto Run/Walk.
; Changes while the game runs. Default: 0
;autorun.walk=1

; Packet flow: before the game sends to the server it waits a while since the last time, and seconds while zoning. On,
; once the server has answered (or the game has said it's leaving the zone) the wait is cut short, so the two take turns
; as fast as the connection allows: zoning takes a fraction of the time and fewer packets are dropped in busy places.
; What the PacketFlow plugin did (it isn't loaded while this is on). /vana > Client > Game > Packet flow. Changes while
; the game runs. Default: 1
;packetflow=0

; Simple Log Fix: the SimpleLog addon blocks an action (a spell, a weapon skill, an ability) it takes for one the server
; sent twice, and it takes real ones for that: a buffer from the server that has the same packet twice (party buffs often
; do) makes it block every action after the second copy, so the game never gets it: no animation, no chat line, only the
; cast bar of an addon that doesn't look at blocks (XIUI's). On, VanaCore swaps its check for one that tells buffers
; apart by VanaCore's own count, so only what the server really sent again is blocked. Off, SimpleLog's own. Does nothing
; without SimpleLog. /vana > Client > Game > Simple Log Fix. Changes while the game runs. Default: 1
;simplelog.fix=0

; Prevent Addon Packet Block: an action from the server (0x028) that an addon blocks goes to the game all the same, its
; chat lines taken out, so its animation always plays. A buffer the server sent again keeps the addon's block (its
; actions came the first time), and so does a plugin's. The first few are logged ("Packets: an addon blocked an
; action..."). /vana > Client > Game > Prevent Addon Packet Block. Changes while the game runs. Default: 1
;packets.keepactions=0

; Sound follows the output: the game opens its sound on Windows' default output when it starts and keeps it, so after you
; switch from headphones to speakers, or a headset disconnects and resets its driver, it stays silent until the game is
; started again. On, the game's sound moves to the new default output by itself (what is playing carries on) whenever
; Windows changes it or the output in use goes away or comes back. /vana > Client > Game > Follow audio output. Read when the
; game starts. Default: 1 (0 on Wine)
;sound.follow=0

; Packet watch: 1 writes what the server's packets did on their way in to logs\vanacore.log ("Packet watch: ..."), for a
; weapon skill or spell that shows no animation and no chat line. Each buffer the server sends starts with a counter that goes up
; by one: one that skips means a buffer never reached the game (lost on the way, or never sent), and one that comes again is
; the server sending it again (a new zone starts the counter over, and isn't counted). Each of your own actions besides melee is
; logged as it arrives, so a skill that showed nothing but has a line here reached VanaCore, and one with no line (and a
; skipped counter near it) never came. Action packets that came and weren't given to the game, and any packet an addon or
; plugin blocked (and which), are logged too, and a line of counts every 30 seconds. Needs logging on ([logging] enabled=1,
; the default). /vana > Client > Game > Packet watch. Changes while the game runs. Default: 0
;packets.watch=1

; 1 shows an FPS counter. Default: 1
;fps.display=0

; The counter's corner: 0 top-left, 1 top-right, 2 bottom-right, 3 bottom-left. Default: 1
fps.position=1

; How far the counter's numbers sit from the screen's corner, in pixels, 0-64: its box (and its
; background) is cut to the numbers with this much round them, right in the corner; 0 puts them in
; it; auto pads it with the text's size, 8 pixels in, as the label is. Default: 0
fps.padding=0

; The label's and counter's font. Defaults: Consolas, 20 (pixels)
font.family=Consolas
font.size=20

; 0 draws the text regular instead of bold, 1 italic. Defaults: 1, 0
;font.bold=0
;font.italic=1

; The text's colour, #RRGGBB or #RRGGBBAA. Default: #FFD700
font.color=#FFD700

; 1 draws a 1px black outline around the text. Default: 1
;font.outline=0

; The font the text in addons' and plugins' ImGui windows draws in, in place of Agave (Ashita's own): a font file's name, looked
; for in fonts\imgui\ and fonts\ here, then the fonts Windows installs for one user and Windows' own; or a full path. .ttf, .otf
; or .ttc. The icons stay Font Awesome's. A file that can't be loaded is logged and Agave used. Needs a restart. Default: Agave
;imgui.font=segoeui.ttf

; The box behind the text: #RRGGBB (55% opaque) or #RRGGBBAA; #00000000 for none. Default: #00000000
font.background=#00000000

[pivot]
; Overlays for the game's files: mods kept in folders of their own, as XIPivot does them for Ashita.
; Each overlay is a folder laid out like the FFXI folder (FTABLE.DAT, ROM\1\45.DAT,
; sound9\win\music\data\music067.bgw). Whatever the game reads from the FFXI folder comes from the
; first overlay in [pivot.order] that has the same file, else from the FFXI folder itself. Any file
; works, the root VTABLE.DAT and FTABLE.DAT too. Reads only. enabled and rootfolder are read when the
; game starts; a change to [pivot.order] or to the overlays' files applies from the next file the game
; opens (a zone's DATs: the next zone).
; 1 turns it on. Default: 0
;enabled=1
; The folder holding the overlays. Default: pivot
;rootfolder=pivot
; 1 logs every file served from an overlay, once each. Default: 0 (the first 20)
;log=1

[pivot.order]
; The overlays: folders under rootfolder, or absolute paths. The lowest number is looked in first,
; and the first overlay that has a file serves it. soulspirexi (the server's own DATs) is always used,
; last, when rootfolder has it.
;0=ffxi-hd
;1=ffxi-maps\1024x1024
;0=soulspirexi

[graphics]
; d3d12: the game draws through VanaCore's own Direct3D 8 on Direct3D 12 (Windows 10+), with the
; scene effects, the interface at a fixed shape, texture packs and faster frames. d3d11: the same on
; Direct3D 11, for cards and drivers where Direct3D 12 runs badly. d3d9: the game
; draws as it does itself, through Direct3D 9 (a d3d9.dll beside the game's executable, ReShade's
; or DXVK's, is used first). d3d8: the game's own. Default: d3d8
; When the graphics card stops on d3d12 (a driver timeout) and the game closes, VanaCore sets this to d3d11 for the
; next start; choose d3d12 again (the launcher's Renderer, /vana) to go back.
;renderer=d3d12

; Set by VanaCore, not by hand: 1 when renderer=d3d12 couldn't draw here (its shaders don't compile, as under Wine or
; Proton, or the card is below resource binding tier 2, as on a Mac under CrossOver), so it switched renderer to d3d11
; and said so at the top left; /vana > Client > About says why while it's set.
; Choosing DirectX 12 again (the launcher's Renderer, /vana) tries it at the next start, and VanaCore takes this out
; once Direct3D 12 draws. Default: not set
;d3d12.unsupported=1

; The scene effects ([graphics.effects] tunes them). Default: 1
;effects=1

; The effects run after the sky's own layers (its dome, clouds, the sun, the moon), so the god rays start from the sun and the
; sky is graded with the world; the game's water layers drawn after the sky get them too. 0 runs them before the sky, as
; before. Needs a restart. Default: 1
;effects.aftersky=0

; (renderer=d3d12) The game's vertex and index buffers share 2 MB blocks of the graphics card's memory instead of each
; being made on its own, which is slow (a zone makes over a thousand as it loads). 0 makes each on its own again, as
; before; for telling whether a graphics problem comes from this. Needs a restart. Default: 1
;slabs=0

; The 3D scene's shape: auto follows the window, a shape (16:9) fixes it, off leaves it to the game.
; Works with either renderer. Default: auto
;aspect=off

; The game's own shadows (Config > Shadows): auto turns them off while VanaCore's sun shadows are on
; (they cost far more for less; any the game still draws meanwhile, as a character's config loads, are
; left out) and leaves them off when VanaCore's are turned off (the Config menu
; puts them back); keep leaves them as the Config menu has them. Default: auto
;gameshadows=keep

; The zone's detail: high draws its buildings and trees with their high-detail meshes at any distance
; (the game swaps them for medium and low ones as the camera moves away, and the sun's shadows change
; shape with them); range keeps each mesh lod.range times farther than the game does; game keeps the
; game's choice. How far away things stop being drawn is the same either way. Changes while the game
; runs. Default: game
;lod=high
; lod=range: how many times farther each object keeps its detail, 0.25 to 10. Default: 2
;lod.range=3

; The game's Bump Mapping option, changed while the game runs: 1 on, 0 off, game as [ffxi] bump_mapping
; set it at the start. Turned on while you play, it loads the zone you're in again (a second or so); off at once.
; Default: game
;bump=1

; How far the game draws the zone (drawdistance) and the characters in it (drawdistance.mobs), as a
; multiplier of the game's distances, 1 to 100: what Ashita's drawdistance addon and the VanaView
; plugin set. The launcher fills both in from its draw distance the first time. The options panel's
; sliders stop at 10. Changes while the game runs. Default: 5, 5
;drawdistance=5
;drawdistance.mobs=5
; The zone's draw distance on the ferries and the open sea routes, in place of drawdistance (Boat rides on the
; panel), 1 to 100. Changes while the game runs. Default: 1
;drawdistance.ship=1
; How far characters can be targeted (Tab, the mouse, the nearest-target keys): game only as far as the game's own
; character distance, as without VanaCore; drawn as far as drawdistance.mobs draws them. The game never checks for
; walls, so drawn lets you target NPCs and doors in the next room. Changes while the game runs. Default: game
;drawdistance.target=drawn
; 0 puts both back to 1 (the game's own distances), without changing the values above. Default: 1
;drawdistance.enabled=0
; 1 draws every piece of the zone in view out to drawdistance (above 1), past the lists of pieces the zone's
; files make for each place at the game's own distance. Fills in far ground that can be missing in a few
; places (trees standing on nothing, Windurst Woods from its ditches), at a large cost in frames, most in big
; zones and cities. 0 uses the game's lists. Changes while the game runs. Default: 0
;drawdistance.full=1
; 1 draws the game's lists, and the big pieces they leave out (25 across or more: ground, buildings), so far
; ground that can be missing is filled in for far fewer frames than drawdistance.full; the small props the
; lists leave out stay out. drawdistance.full=1 takes over. Changes while the game runs. Default: 0
;drawdistance.fill=1
; 1 keeps the game's own draw distance (the fog stays drawdistance's) in Al'Taieu, which the game draws whole,
; with no lists of pieces for each place: there every piece in view out to drawdistance is drawn, at 5x
; nearly the whole zone, for about half the frames. Characters keep drawdistance.mobs. Other zones without
; lists (Sanctuary of Zi'Tah, ships) keep drawdistance. 0 extends Al'Taieu too. Changes while the game
; runs. Default: 1
;drawdistance.large_off=0
; 1 leaves out the zone's pieces hidden behind what's drawn, in a zone drawn without view lists (the Sanctuary
; of Zi'Tah) at a draw distance over 1x: each frame the graphics card tests every piece's box against the
; depth of the world just drawn, and a piece that came back hidden in occl.frames tests in a row and is
; farther than occl.near isn't drawn until a test sees it again (a frame or two later). 2 only counts them
; in vanacore.log every 10 s; 0 draws them all. DirectX 12. Changes while the game runs. Default: 1
;occl=0
; how near (world units) a piece can be and still be left out; nearer ones are always drawn. Default: 80
;occl.near=80
; tests in a row a piece must come back hidden in. Default: 2
;occl.frames=2
; room round each piece's box on the screen, thousandths of its width, for the camera's moves. Default: 10
;occl.margin=10
; 1 leaves out other players (hide.players), their pets (hide.pets) and their trusts (hide.trusts), for
; slow PCs in busy places: the server's updates about them are dropped before the game and the addons
; see them, so they're never loaded, animated or drawn. You, your party and alliance (with their pets
; and trusts) are always shown, and so is anyone who asks you to trade. Changes while the game runs:
; turning one off brings them back at once. /vana > Graphics > Draw distance. Default: 0
;hide.players=1
;hide.pets=1
;hide.trusts=1
; The game's fog: distance leaves it as the game sets it, which pushes it out with a farther draw
; distance; game keeps it where the game's own draw distance puts it, while the zone is drawn
; farther; custom puts it from fog.start to fog.end everywhere. Default: distance
;fog=game
; fog=custom: where the fog starts, and where it's whole (at least a unit farther). Defaults: 100, 400
;fog.start=100
;fog.end=400

; The names over characters' heads: stretched leaves them as the game draws them, widening with the
; window (a third wider at 16:9); fix keeps the shape they have in a 4:3 window in any window; spaced
; keeps it and draws their letters closer (ffxi-hd's name font spaces them wide). Works with either
; renderer; changes while the game runs. Default: spaced
;nameplates=fix
; spaced's gap between letters' bright cores, in the font's pixels (their outlines overlap), -8 to 16.
; ffxi-hd's font has blank pixels round its letters, so 3 closes them up; CatsEyeXI's italic font has
; hardly any, so its letters need less than that to move at all: try 0, then -1 to -3 (cores that
; overlap). Changes while the game runs. Default: 3
;nameplates.gap=3
; 1 leaves out the name over your own character's head (everyone else's stays). Changes while the
; game runs. Default: 0
;nameplates.hideown=1
; 1 leaves out the names of your party's other members (players and trusts), and of the alliance's
; other two parties' members, for a party list addon that shows them in its own bars (YunaUI). Found by
; their server ids in the game's party list, read again four times a second; the rest's names go by
; the settings around these. Changes while the game runs. Default: 0
;nameplates.hideparty=1
;nameplates.hidealliance=1
; 1 leaves out other players' names (NPCs' and monsters' stay; yours goes by nameplates.hideown).
; Changes while the game runs. Default: 0
;nameplates.hideplayers=1
; 1 leaves out NPCs', monsters', trusts' or players' pets' names (by the colour the game gives the name; the
; line under it goes too). Changes while the game runs. Default: 0
;nameplates.hidenpcs=1
;nameplates.hidemonsters=1
;nameplates.hidetrusts=1
;nameplates.hidepets=1
; The icons by players' names: 0 leaves out the bazaar bag (a player in a linkshell shows its pearl in
; its place, as the game does without a bazaar), the linkshell's pearl, the job master's stars under the
; name. Changes while the game runs. Default: 1 each
;nameplates.bazaar=0
;nameplates.linkshell=0
;nameplates.mastery=0
; A GM's icon by their name (in GM mode) and their mark in the Target window as CatsEyeXI's staff pictures (dev, admin,
; sgm, gm; who's which is built into VanaCore by the server's host, and only CatsEyeXI's servers have a list: anywhere else
; the game's), 0 the game's. A mentor's icon stays the game's. Changes while the game runs. Default: 1
;nameplates.gm=0
; Its size, times the game's icon's height (0.5 to 3), and moved from beside the name in the game's pixels at
; nameplates.size 1 (-100 to 100; x right, y down), both from where nameplates.pearl.size, .x and .y put the icon.
; Changes while the game runs. Default: 1.25, 0, -2
;nameplates.gm.size=1.5
;nameplates.gm.x=2
;nameplates.gm.y=0
; The job master's stars (a big one between two small ones): game as the game draws them, one only the big star,
; small all three as small stars. Changes while the game runs. Default: game
;nameplates.stars.style=one
; The linkshell pearl moved from where the game draws it, in the game's pixels (-100 to 100) at nameplates.size 1: x
; above 0 right, closing the gap between the pearl and the name; y above 0 down. x is as a 16:9 window has it: in a
; wider one, where the names keep their shape (nameplates=fix or spaced) and the gap is narrower, it's narrowed with it,
; so the icon stays clear of the name. Changes while the game runs. Default: 38, -1
;nameplates.pearl.x=6
;nameplates.pearl.y=0
; The pearl's and the bazaar bag's width over their height on the screen, the same in any window and with the game's
; letters or True Font: 16:9 (the game's art is narrowed for a stretch to 16:9), 4:3, any w:h or ratio, or game for
; the way the game draws them, stretching with the window. Not applied with nameplates=stretched and the game's
; letters, which leave names as the game draws them. Changes while the game runs. Default: 16:9
;nameplates.pearl.shape=4:3
