; SoulspireXI Experimental Minimal Runtime Configuration (CLIENT-MODERN-001)
; Copy this file to vanacore.ini next to VanaCore.exe before launching.
;
; SECURITY NOTICE:
;   Do NOT put password= in this file (plaintext INI passwords are disabled).
;   Launch VanaCore.exe interactively for a hidden password prompt, or pipe
;   your password via --password-stdin.
;
; PATH CONFIGURATION:
;   Set pol= and ffxi= below to your existing PlayOnlineViewer and FINAL FANTASY XI
;   install folders (your retail/Ashita FFXI files are NEVER modified).

[server]
server=play.soulspirexi.com
; Optional: set your SoulspireXI account username (or omit to be prompted).
;user=YourUsername

[client]
; Point these to your existing Square Enix / PlayOnline / FFXI folders:
;pol=C:\Program Files (x86)\PlayOnline\SquareEnix\PlayOnlineViewer
;ffxi=C:\Program Files (x86)\PlayOnline\SquareEnix\FINAL FANTASY XI

; Keep console attached during experimental testing so startup/login diagnostics stay visible.
attached=1
autoclose=0
autologin=0

; Minimal runtime profile: disable experimental menu/UI hooks initially.
singlemenu=0
configmenu=0
gamesettings.extended=0
partyfinder.findmember=0
macrooptions.equipfirst=0
blink.disable=0

[graphics]
; DirectX 12 renderer (switch to d3d11 if troubleshooting GPU/driver compatibility).
renderer=d3d12
window.mode=borderless
;resolution.width=1920
;resolution.height=1080
;resolution.ui.width=1920
;resolution.ui.height=1080
fps=60

[addons]
; Target Ashita v4.30 plugin ABI when progressive plugin testing begins later.
ashita.interface=4.30

[pivot]
; DAT overlay redirection (reads pivot\soulspirexi\ without modifying retail FFXI DATs).
enabled=1
rootfolder=pivot

[discord]
; Disabled by default in SoulspireXI minimal runtime profile.
enabled=0

[mcp]
; Disabled and hidden from /vana by default in SoulspireXI player profiles (PLAYER-CMD-001).
available=0
enabled=0

[developer]
; Developer eval/debug commands (/vana lua, /addon exec, /vana debug, /api) disabled by default.
enabled=0

[logging]
; Writes logs\vanacore.log (required for CLIENT-MODERN-001 runtime diagnostics).
enabled=1
